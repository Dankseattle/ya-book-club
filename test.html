<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Committee Deep Dive - Ya Dood Book Club</title>
    <link rel="icon" type="image/png" href="clublogo.png">
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; color: #0f172a; }
        .font-header { font-family: 'Space Grotesk', sans-serif; }
        
        .member-card { background: white; border: 1px solid #e2e8f0; border-radius: 1.5rem; overflow: hidden; margin-bottom: 2rem; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        .stat-box { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 1rem; padding: 1rem; text-align: center; }
        .stat-label { font-size: 0.65rem; font-weight: 800; text-transform: uppercase; color: #64748b; letter-spacing: 0.05em; margin-bottom: 0.25rem; }
        .stat-value { font-size: 1.125rem; font-weight: 900; color: #0f172a; font-family: 'Space Grotesk', sans-serif; }
        
        .book-row { display: flex; align-items: center; gap: 0.75rem; padding: 0.5rem; border-radius: 0.5rem; transition: background 0.2s; cursor: pointer; }
        .book-row:hover { background-color: #f1f5f9; }
        .rank-circle { width: 1.5rem; height: 1.5rem; display: flex; align-items: center; justify-content: center; border-radius: 9999px; font-size: 0.65rem; font-weight: 800; }
        
        /* Badges */
        .badge-green { background: #dcfce7; color: #166534; }
        .badge-red { background: #fee2e2; color: #991b1b; }
        .badge-blue { background: #dbeafe; color: #1e40af; }
    </style>
</head>
<body>

    <header class="bg-white border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-6 py-4 flex justify-between items-center">
            <h1 class="text-xl font-black uppercase tracking-tight font-header">Committee <span class="text-blue-600">Deep Dive</span></h1>
            <a href="index.html" class="text-xs font-bold uppercase text-slate-400 hover:text-slate-900 transition">Back to Main</a>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-6 py-8">
        <div id="loading" class="text-center py-20">
            <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600 mx-auto mb-4"></div>
            <p class="text-xs font-bold uppercase text-slate-400">Crunching the numbers...</p>
        </div>
        
        <div id="content" class="hidden">
            </div>
    </main>

    <div id="modal" class="fixed inset-0 bg-slate-900/80 hidden z-[100] items-center justify-center backdrop-blur-sm" onclick="this.classList.add('hidden')">
        <div class="bg-white p-8 rounded-2xl max-w-sm w-full text-center shadow-2xl" onclick="event.stopPropagation()">
            <h2 id="m-title" class="text-xl font-black uppercase font-header mb-2"></h2>
            <p id="m-rank" class="text-blue-600 font-bold text-sm uppercase"></p>
        </div>
    </div>

    <script>
        const SHEET_ID = '13bOmsDf8HibgVqyfcKWoH7SZPxk3k3ZIIOf--mduqbU';
        const members = [{id:'kirk', n:'Kirk'},{id:'huber', n:'Huber'},{id:'lattanzio', n:'Lattanzio'},{id:'walco', n:'Walco'}];
        let allData = [];

        async function load() {
            try {
                const res = await fetch(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=0`);
                const txt = await res.text();
                
                allData = txt.split('\n').slice(1).map((r, i) => {
                    const c = r.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                    const rRaw = (c[11]||"").replace(/"/g,"").trim();
                    const hasRank = rRaw && rRaw !== 'N/A';
                    
                    return {
                        id: parseInt(c[0])||(i+1),
                        title: (c[1]||"").replace(/"/g,""),
                        author: (c[2]||"").replace(/"/g,""),
                        rank: hasRank ? parseInt(rRaw) : 999,
                        img: `covers/${parseInt(c[0])||(i+1)}.jpg`,
                        selector: (c[16]||"").replace(/"/g,""),
                        scores: [parseInt(c[3])||999, parseInt(c[4])||999, parseInt(c[5])||999, parseInt(c[6])||999]
                    };
                }).filter(b => b.title && b.title !== "Book");

                renderDeepDive();
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('content').classList.remove('hidden');

            } catch (e) { console.error(e); document.getElementById('loading').innerHTML = "Error loading data."; }
        }

        function renderDeepDive() {
            const container = document.getElementById('content');
            const ranked = allData.filter(b => b.rank !== 999);

            container.innerHTML = members.map((m, mIdx) => {
                // 1. Calculate Contributions (Picks)
                const myPicks = ranked.filter(b => b.selector.toLowerCase().includes(m.n.toLowerCase()));
                myPicks.sort((a,b) => a.rank - b.rank);
                
                const bestPick = myPicks.length ? myPicks[0] : null;
                const worstPick = myPicks.length ? myPicks[myPicks.length - 1] : null;
                const avgPickRank = myPicks.length ? Math.round(myPicks.reduce((a,b)=>a+b.rank,0)/myPicks.length) : '-';

                // 2. Calculate Grading Style (Avg Score Given)
                const myScores = ranked.map(b => b.scores[mIdx]).filter(s => s !== 999);
                const avgScoreGiven = myScores.length ? Math.round(myScores.reduce((a,b)=>a+b,0)/myScores.length) : '-';

                // 3. Find Contrarian Opinions
                // "Underrated" = I ranked it #5, Group ranked it #50 (Diff = 45)
                // "Overrated" = I ranked it #50, Group ranked it #5 (Diff = -45)
                let biggestLove = { diff: -999, book: null };
                let biggestHate = { diff: 999, book: null };

                ranked.forEach(b => {
                    const myScore = b.scores[mIdx];
                    if (myScore !== 999) {
                        const diff = b.rank - myScore; // Positive = I liked it more
                        if (diff > biggestLove.diff) biggestLove = { diff, book: b };
                        if (diff < biggestHate.diff) biggestHate = { diff, book: b };
                    }
                });

                // 4. Top/Bottom 5
                const faves = allData.filter(b => b.scores[mIdx] !== 999).sort((a,b) => a.scores[mIdx] - b.scores[mIdx]).slice(0, 5);
                const least = allData.filter(b => b.scores[mIdx] !== 999).sort((a,b) => b.scores[mIdx] - a.scores[mIdx]).slice(0, 5);

                return `
                <div class="member-card">
                    <div class="bg-slate-900 text-white p-6 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                        <div>
                            <h2 class="text-3xl font-bold uppercase italic font-header">${m.n}</h2>
                            <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mt-1">
                                Member Profile
                            </p>
                        </div>
                        <div class="flex gap-2">
                            <div class="bg-slate-800 px-4 py-2 rounded-lg text-center">
                                <div class="text-[10px] font-bold text-slate-400 uppercase">Avg Pick</div>
                                <div class="text-xl font-bold">#${avgPickRank}</div>
                            </div>
                            <div class="bg-slate-800 px-4 py-2 rounded-lg text-center">
                                <div class="text-[10px] font-bold text-slate-400 uppercase">Avg Given</div>
                                <div class="text-xl font-bold">#${avgScoreGiven}</div>
                            </div>
                        </div>
                    </div>

                    <div class="p-6 grid grid-cols-1 md:grid-cols-2 gap-8">
                        
                        <div class="space-y-6">
                            
                            <div>
                                <h3 class="text-xs font-black uppercase text-slate-400 tracking-widest mb-4 border-b pb-2">Legacy</h3>
                                <div class="grid grid-cols-2 gap-4">
                                    <div class="bg-green-50 border border-green-100 rounded-xl p-4 cursor-pointer hover:bg-green-100 transition" onclick="showBook('${bestPick?.title}', ${bestPick?.rank})">
                                        <div class="flex items-center gap-2 mb-2">
                                            <span class="text-lg">👑</span>
                                            <span class="text-[9px] font-bold uppercase text-green-800">Best Pick</span>
                                        </div>
                                        <p class="font-bold text-sm leading-tight text-slate-900 line-clamp-2">${bestPick ? bestPick.title : '-'}</p>
                                        <p class="text-[10px] font-bold text-green-600 mt-1">Ranked #${bestPick ? bestPick.rank : '-'}</p>
                                    </div>
                                    <div class="bg-red-50 border border-red-100 rounded-xl p-4 cursor-pointer hover:bg-red-100 transition" onclick="showBook('${worstPick?.title}', ${worstPick?.rank})">
                                        <div class="flex items-center gap-2 mb-2">
                                            <span class="text-lg">💀</span>
                                            <span class="text-[9px] font-bold uppercase text-red-800">Worst Pick</span>
                                        </div>
                                        <p class="font-bold text-sm leading-tight text-slate-900 line-clamp-2">${worstPick ? worstPick.title : '-'}</p>
                                        <p class="text-[10px] font-bold text-red-600 mt-1">Ranked #${worstPick ? worstPick.rank : '-'}</p>
                                    </div>
                                </div>
                            </div>

                            <div>
                                <h3 class="text-xs font-black uppercase text-slate-400 tracking-widest mb-4 border-b pb-2">Hot Takes</h3>
                                <div class="space-y-3">
                                    <div class="flex items-center justify-between bg-white border border-slate-100 p-3 rounded-xl shadow-sm">
                                        <div>
                                            <div class="flex items-center gap-2 mb-1">
                                                <span class="bg-blue-100 text-blue-700 text-[9px] font-bold px-2 py-0.5 rounded uppercase">Hidden Gem</span>
                                                <span class="text-[9px] text-slate-400 font-bold">They liked it way more</span>
                                            </div>
                                            <p class="font-bold text-sm text-slate-900">${biggestLove.book ? biggestLove.book.title : '-'}</p>
                                        </div>
                                        <div class="text-right">
                                            <div class="text-xs font-bold text-blue-600">#${biggestLove.book ? biggestLove.book.scores[mIdx] : '-'}</div>
                                            <div class="text-[9px] text-slate-400">vs Group #${biggestLove.book ? biggestLove.book.rank : '-'}</div>
                                        </div>
                                    </div>

                                    <div class="flex items-center justify-between bg-white border border-slate-100 p-3 rounded-xl shadow-sm">
                                        <div>
                                            <div class="flex items-center gap-2 mb-1">
                                                <span class="bg-slate-200 text-slate-600 text-[9px] font-bold px-2 py-0.5 rounded uppercase">Overrated</span>
                                                <span class="text-[9px] text-slate-400 font-bold">They hated it</span>
                                            </div>
                                            <p class="font-bold text-sm text-slate-900">${biggestHate.book ? biggestHate.book.title : '-'}</p>
                                        </div>
                                        <div class="text-right">
                                            <div class="text-xs font-bold text-slate-900">#${biggestHate.book ? biggestHate.book.scores[mIdx] : '-'}</div>
                                            <div class="text-[9px] text-slate-400">vs Group #${biggestHate.book ? biggestHate.book.rank : '-'}</div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                        </div>

                        <div class="grid grid-cols-2 gap-6">
                            <div>
                                <h3 class="text-xs font-black uppercase text-green-600 tracking-widest mb-4 border-b border-green-100 pb-2">Top 5</h3>
                                <div class="space-y-2">
                                    ${faves.map((b, i) => `
                                        <div class="flex items-start gap-2">
                                            <span class="text-[10px] font-bold text-green-500 w-4 pt-0.5">${i+1}</span>
                                            <div class="min-w-0">
                                                <p class="text-xs font-bold text-slate-900 truncate">${b.title}</p>
                                                <p class="text-[9px] text-slate-400">Ranked #${b.rank}</p>
                                            </div>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                            <div>
                                <h3 class="text-xs font-black uppercase text-red-600 tracking-widest mb-4 border-b border-red-100 pb-2">Bottom 5</h3>
                                <div class="space-y-2">
                                    ${least.map((b, i) => `
                                        <div class="flex items-start gap-2">
                                            <span class="text-[10px] font-bold text-red-500 w-4 pt-0.5">${i+1}</span>
                                            <div class="min-w-0">
                                                <p class="text-xs font-bold text-slate-900 truncate">${b.title}</p>
                                                <p class="text-[9px] text-slate-400">Ranked #${b.rank}</p>
                                            </div>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        </div>

                    </div>
                </div>
                `;
            }).join('');
        }

        function showBook(title, rank) {
            document.getElementById('m-title').innerText = title;
            document.getElementById('m-rank').innerText = 'Consensus Rank #' + rank;
            document.getElementById('modal').classList.remove('hidden');
            document.getElementById('modal').classList.add('flex');
        }

        load();
    </script>
</body>
</html>
