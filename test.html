<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Committee Deep Dive - Ya Dood Book Club</title>
    <link rel="icon" type="image/png" href="clublogo.png">
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; color: #0f172a; }
        .font-header { font-family: 'Space Grotesk', sans-serif; }
        
        .member-card { background: white; border: 1px solid #e2e8f0; border-radius: 1.5rem; overflow: hidden; margin-bottom: 2rem; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        
        /* Stats */
        .stat-pill { background: #f8fafc; padding: 0.5rem 1rem; border-radius: 0.5rem; text-align: center; border: 1px solid #e2e8f0; }
        .stat-label { font-size: 0.6rem; font-weight: 800; text-transform: uppercase; color: #64748b; letter-spacing: 0.05em; }
        .stat-val { font-size: 1rem; font-weight: 900; color: #0f172a; font-family: 'Space Grotesk', sans-serif; }

        /* Badges & Pills */
        .tag-base { font-weight: 800; font-size: 0.65rem; padding: 2px 6px; border-radius: 4px; text-transform: uppercase; }
        .tag-blue { background: #dbeafe; color: #1e40af; }
        .tag-slate { background: #f1f5f9; color: #475569; }
        
        .maverick-bar { height: 4px; border-radius: 2px; background: #e2e8f0; overflow: hidden; margin-top: 4px; }
        .maverick-fill { height: 100%; background: #2563eb; }
    </style>
</head>
<body>

    <header class="bg-white border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-6 py-4 flex justify-between items-center">
            <h1 class="text-xl font-black uppercase tracking-tight font-header">Committee <span class="text-blue-600">Deep Dive</span></h1>
            <a href="index.html" class="text-xs font-bold uppercase text-slate-400 hover:text-slate-900 transition">Back to Main</a>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-6 py-8">
        <div id="loading" class="text-center py-20">
            <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600 mx-auto mb-4"></div>
            <p class="text-xs font-bold uppercase text-slate-400">Analyzing reading habits...</p>
        </div>
        
        <div id="content" class="hidden">
            </div>
    </main>

    <div id="modal" class="fixed inset-0 bg-slate-900/80 hidden z-[100] items-center justify-center backdrop-blur-sm" onclick="this.classList.add('hidden')">
        <div class="bg-white p-8 rounded-2xl max-w-sm w-full text-center shadow-2xl" onclick="event.stopPropagation()">
            <h2 id="m-title" class="text-xl font-black uppercase font-header mb-2"></h2>
            <p id="m-rank" class="text-blue-600 font-bold text-sm uppercase"></p>
        </div>
    </div>

    <script>
        const SHEET_ID = '13bOmsDf8HibgVqyfcKWoH7SZPxk3k3ZIIOf--mduqbU';
        const members = [{id:'kirk', n:'Kirk'},{id:'huber', n:'Huber'},{id:'lattanzio', n:'Lattanzio'},{id:'walco', n:'Walco'}];
        let allData = [];

        async function load() {
            try {
                const res = await fetch(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=0`);
                const txt = await res.text();
                
                allData = txt.split('\n').slice(1).map((r, i) => {
                    const c = r.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                    const rRaw = (c[11]||"").replace(/"/g,"").trim();
                    const hasRank = rRaw && rRaw !== 'N/A';
                    
                    return {
                        id: parseInt(c[0])||(i+1),
                        title: (c[1]||"").replace(/"/g,""),
                        author: (c[2]||"").replace(/"/g,""),
                        rank: hasRank ? parseInt(rRaw) : 999,
                        genre: (c[17]||"Other").replace(/"/g,"").trim(),
                        selector: (c[16]||"").replace(/"/g,""),
                        scores: [parseInt(c[3])||999, parseInt(c[4])||999, parseInt(c[5])||999, parseInt(c[6])||999]
                    };
                }).filter(b => b.title && b.title !== "Book");

                renderDeepDive();
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('content').classList.remove('hidden');

            } catch (e) { console.error(e); document.getElementById('loading').innerHTML = "Error loading data."; }
        }

        function renderDeepDive() {
            const container = document.getElementById('content');
            const ranked = allData.filter(b => b.rank !== 999);

            container.innerHTML = members.map((m, mIdx) => {
                // 1. Selector Stats
                const myPicks = ranked.filter(b => b.selector.toLowerCase().includes(m.n.toLowerCase()));
                myPicks.sort((a,b) => a.rank - b.rank);
                const bestPick = myPicks[0];
                const worstPick = myPicks[myPicks.length - 1];
                const avgPickRank = myPicks.length ? Math.round(myPicks.reduce((a,b)=>a+b.rank,0)/myPicks.length) : '-';

                // 2. Contrarian Score (Formerly Consensus Gap)
                let totalDev = 0, devCount = 0;
                ranked.forEach(b => {
                    if(b.scores[mIdx] !== 999) {
                        totalDev += Math.abs(b.scores[mIdx] - b.rank);
                        devCount++;
                    }
                });
                const contrarianScore = devCount ? Math.round(totalDev / devCount) : 0;
                
                // Alignment Label
                let alignLabel = "The Anchor"; 
                let alignColor = "bg-blue-600";
                if (contrarianScore > 25) { alignLabel = "The Wildcard"; alignColor = "bg-purple-600"; }
                else if (contrarianScore > 15) { alignLabel = "Independent"; alignColor = "bg-indigo-500"; }

                // 3. Taste Profile: Fiction vs Non-Fiction
                let ficSum = 0, ficCount = 0;
                let nonSum = 0, nonCount = 0;

                ranked.forEach(b => {
                    const score = b.scores[mIdx];
                    if(score === 999) return;
                    
                    if(b.genre === 'Fiction') { ficSum += score; ficCount++; }
                    else if(b.genre === 'Non-Fiction') { nonSum += score; nonCount++; }
                });

                const avgFic = ficCount ? Math.round(ficSum / ficCount) : '-';
                const avgNon = nonCount ? Math.round(nonSum / nonCount) : '-';
                
                // Determine Preference
                let prefLabel = "Balanced";
                let prefColor = "text-slate-400";
                if (avgFic !== '-' && avgNon !== '-') {
                    if (avgFic < avgNon - 5) { prefLabel = "Fiction Lean"; prefColor = "text-blue-600"; }
                    else if (avgNon < avgFic - 5) { prefLabel = "Non-Fic Lean"; prefColor = "text-emerald-600"; }
                }

                // 4. Hot Takes
                let biggestLove = { diff: -999, book: null };
                let biggestHate = { diff: 999, book: null };
                ranked.forEach(b => {
                    const myScore = b.scores[mIdx];
                    if (myScore !== 999) {
                        const diff = b.rank - myScore; // Positive = I liked it more
                        if (diff > biggestLove.diff) biggestLove = { diff, book: b };
                        if (diff < biggestHate.diff) biggestHate = { diff, book: b };
                    }
                });

                // 5. Lists
                const faves = allData.filter(b => b.scores[mIdx] !== 999).sort((a,b) => a.scores[mIdx] - b.scores[mIdx]).slice(0, 5);
                const least = allData.filter(b => b.scores[mIdx] !== 999).sort((a,b) => b.scores[mIdx] - a.scores[mIdx]).slice(0, 5);

                return `
                <div class="member-card">
                    <div class="bg-slate-900 text-white p-6 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                        <div>
                            <h2 class="text-3xl font-bold uppercase italic font-header">${m.n}</h2>
                            <div class="flex items-center gap-2 mt-1">
                                <span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">${alignLabel}</span>
                                <div class="w-16 h-1 bg-slate-700 rounded-full overflow-hidden">
                                    <div class="h-full ${alignColor}" style="width: ${(contrarianScore/50)*100}%"></div>
                                </div>
                            </div>
                        </div>
                        <div class="flex gap-2">
                            <div class="stat-pill bg-slate-800 border-slate-700">
                                <div class="stat-label text-slate-400">Avg Pick Rank</div>
                                <div class="stat-val text-white">#${avgPickRank}</div>
                            </div>
                            <div class="stat-pill bg-slate-800 border-slate-700">
                                <div class="stat-label text-slate-400">Contrarian Score</div>
                                <div class="stat-val text-white">${contrarianScore}</div>
                            </div>
                        </div>
                    </div>

                    <div class="p-6 grid grid-cols-1 md:grid-cols-2 gap-8">
                        
                        <div class="space-y-6">
                            
                            <div>
                                <h3 class="text-xs font-black uppercase text-slate-400 tracking-widest mb-4 border-b pb-2">Legacy</h3>
                                <div class="grid grid-cols-2 gap-3">
                                    <div class="bg-slate-50 border border-slate-200 rounded-xl p-3 cursor-pointer hover:border-green-400 transition group" onclick="showBook('${bestPick?.title}', ${bestPick?.rank})">
                                        <div class="text-[9px] font-bold uppercase text-green-600 mb-1 flex items-center gap-1">👑 Best Pick</div>
                                        <p class="font-bold text-xs leading-tight text-slate-900 line-clamp-2 group-hover:text-green-700">${bestPick ? bestPick.title : '-'}</p>
                                        <p class="text-[9px] font-bold text-slate-400 mt-1">#${bestPick ? bestPick.rank : '-'}</p>
                                    </div>
                                    <div class="bg-slate-50 border border-slate-200 rounded-xl p-3 cursor-pointer hover:border-red-400 transition group" onclick="showBook('${worstPick?.title}', ${worstPick?.rank})">
                                        <div class="text-[9px] font-bold uppercase text-red-600 mb-1 flex items-center gap-1">💀 Worst Pick</div>
                                        <p class="font-bold text-xs leading-tight text-slate-900 line-clamp-2 group-hover:text-red-700">${worstPick ? worstPick.title : '-'}</p>
                                        <p class="text-[9px] font-bold text-slate-400 mt-1">#${worstPick ? worstPick.rank : '-'}</p>
                                    </div>
                                </div>
                            </div>

                            <div>
                                <div class="flex justify-between items-end mb-4 border-b pb-2">
                                    <h3 class="text-xs font-black uppercase text-slate-400 tracking-widest">Taste Profile</h3>
                                    <span class="text-[9px] font-bold uppercase ${prefColor}">${prefLabel}</span>
                                </div>
                                <div class="bg-white border border-slate-100 rounded-xl p-4 shadow-sm flex justify-between items-center">
                                    <div class="text-center w-1/2 border-r border-slate-100">
                                        <span class="tag-base tag-blue mb-1 block w-fit mx-auto">Fiction</span>
                                        <div class="text-[9px] text-slate-400 font-bold uppercase mt-1">Avg Rank</div>
                                        <div class="font-bold text-slate-900 text-xl">#${avgFic}</div>
                                    </div>
                                    <div class="text-center w-1/2">
                                        <span class="tag-base tag-slate mb-1 block w-fit mx-auto">Non-Fic</span>
                                        <div class="text-[9px] text-slate-400 font-bold uppercase mt-1">Avg Rank</div>
                                        <div class="font-bold text-slate-900 text-xl">#${avgNon}</div>
                                    </div>
                                </div>
                            </div>

                            <div>
                                <h3 class="text-xs font-black uppercase text-slate-400 tracking-widest mb-4 border-b pb-2">Hot Takes</h3>
                                <div class="space-y-3">
                                    <div class="flex items-center justify-between bg-slate-50 border border-slate-100 p-3 rounded-lg">
                                        <div>
                                            <span class="text-[9px] font-bold text-blue-600 uppercase">Underrated Gem</span>
                                            <p class="font-bold text-xs text-slate-900 mt-0.5">${biggestLove.book ? biggestLove.book.title : '-'}</p>
                                        </div>
                                        <div class="text-right">
                                            <div class="text-xs font-bold text-slate-900">#${biggestLove.book ? biggestLove.book.scores[mIdx] : '-'}</div>
                                            <div class="text-[8px] font-bold text-slate-400">vs Consensus #${biggestLove.book ? biggestLove.book.rank : '-'}</div>
                                        </div>
                                    </div>
                                    <div class="flex items-center justify-between bg-slate-50 border border-slate-100 p-3 rounded-lg">
                                        <div>
                                            <span class="text-[9px] font-bold text-orange-600 uppercase">Overrated Dud</span>
                                            <p class="font-bold text-xs text-slate-900 mt-0.5">${biggestHate.book ? biggestHate.book.title : '-'}</p>
                                        </div>
                                        <div class="text-right">
                                            <div class="text-xs font-bold text-slate-900">#${biggestHate.book ? biggestHate.book.scores[mIdx] : '-'}</div>
                                            <div class="text-[8px] font-bold text-slate-400">vs Consensus #${biggestHate.book ? biggestHate.book.rank : '-'}</div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                        </div>

                        <div class="grid grid-cols-2 gap-6">
                            <div>
                                <h3 class="text-xs font-black uppercase text-green-600 tracking-widest mb-4 border-b border-green-100 pb-2">Top 5</h3>
                                <div class="space-y-2">
                                    ${faves.map((b, i) => `
                                        <div class="flex items-start gap-2">
                                            <span class="text-[10px] font-bold text-green-500 w-4 pt-0.5">${i+1}</span>
                                            <div class="min-w-0">
                                                <p class="text-[10px] font-bold text-slate-900 truncate">${b.title}</p>
                                                <p class="text-[8px] font-bold text-slate-400">#${b.scores[mIdx]}</p>
                                            </div>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                            <div>
                                <h3 class="text-xs font-black uppercase text-red-600 tracking-widest mb-4 border-b border-red-100 pb-2">Bottom 5</h3>
                                <div class="space-y-2">
                                    ${least.map((b, i) => `
                                        <div class="flex items-start gap-2">
                                            <span class="text-[10px] font-bold text-red-500 w-4 pt-0.5">${i+1}</span>
                                            <div class="min-w-0">
                                                <p class="text-[10px] font-bold text-slate-900 truncate">${b.title}</p>
                                                <p class="text-[8px] font-bold text-slate-400">#${b.scores[mIdx]}</p>
                                            </div>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        </div>

                    </div>
                </div>
                `;
            }).join('');
        }

        function showBook(title, rank) {
            document.getElementById('m-title').innerText = title;
            document.getElementById('m-rank').innerText = 'Consensus Rank #' + rank;
            document.getElementById('modal').classList.remove('hidden');
            document.getElementById('modal').classList.add('flex');
        }

        load();
    </script>
</body>
</html>
