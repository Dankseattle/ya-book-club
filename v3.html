<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YA Book Club - Stream</title>
    <link rel="icon" type="image/png" href="clublogo.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #141414; color: white; overflow-x: hidden; }
        
        /* Hide Scrollbar but allow scrolling */
        .scroll-row::-webkit-scrollbar { display: none; }
        .scroll-row { -ms-overflow-style: none; scrollbar-width: none; }
        
        .hero-gradient { background: linear-gradient(to top, #141414 10%, transparent 100%); }
        
        /* Book Cards */
        .book-card { 
            flex: 0 0 auto; 
            width: 140px; 
            transition: transform 0.3s ease, opacity 0.3s ease; 
            cursor: pointer;
            position: relative;
        }
        .book-card:hover { transform: scale(1.1); z-index: 20; }
        .book-card:hover .info-overlay { opacity: 1; }
        
        /* Hover Info */
        .info-overlay {
            position: absolute; inset: 0; background: rgba(0,0,0,0.8);
            display: flex; flex-col; justify-content: center; align-items: center;
            opacity: 0; transition: opacity 0.2s ease; border-radius: 4px;
            text-align: center; padding: 10px;
        }

        @media (min-width: 768px) {
            .book-card { width: 180px; }
        }

        #modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0, 0.9); z-index: 50; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
        #modal.active { display: flex; }
    </style>
</head>
<body>

    <nav class="fixed top-0 w-full z-40 px-6 py-4 flex justify-between items-center bg-gradient-to-b from-black/80 to-transparent">
        <div class="flex items-center gap-4">
            <img src="clublogo.png" class="h-8 w-auto">
            <span class="font-black italic text-red-600 text-xl tracking-tighter">YA-FLIX</span>
        </div>
        <div class="text-xs font-bold text-gray-300">The Committee Selection</div>
    </nav>

    <div id="hero-section" class="relative h-[70vh] w-full flex items-center justify-center overflow-hidden">
        </div>

    <main class="relative z-10 -mt-20 pb-20 space-y-8 pl-4 md:pl-12">
        
        <div>
            <h2 class="text-lg font-bold text-white mb-2 hover:text-red-500 cursor-pointer transition">The Hall of Fame <span class="text-xs text-gray-500 ml-2 font-normal">Top Ranked</span></h2>
            <div id="row-top" class="scroll-row flex gap-4 overflow-x-auto overflow-y-hidden py-4 pr-12"></div>
        </div>

        <div>
            <h2 class="text-lg font-bold text-white mb-2">Fresh Arrivals <span class="text-xs text-gray-500 ml-2 font-normal">Just Added</span></h2>
            <div id="row-latest" class="scroll-row flex gap-4 overflow-x-auto overflow-y-hidden py-4 pr-12"></div>
        </div>

        <div>
            <h2 class="text-lg font-bold text-white mb-2">The Sweet Spot <span class="text-xs text-gray-500 ml-2 font-normal">Under 350 Pages</span></h2>
            <div id="row-short" class="scroll-row flex gap-4 overflow-x-auto overflow-y-hidden py-4 pr-12"></div>
        </div>

        <div>
            <h2 class="text-lg font-bold text-white mb-2">Fiction <span class="text-xs text-gray-500 ml-2 font-normal">Genre</span></h2>
            <div id="row-fiction" class="scroll-row flex gap-4 overflow-x-auto overflow-y-hidden py-4 pr-12"></div>
        </div>

    </main>

    <div id="modal" onclick="this.classList.remove('active')">
        <div class="bg-[#181818] p-8 rounded-xl max-w-md w-full relative" onclick="event.stopPropagation()">
            <div class="flex gap-6">
                <img id="modal-img" src="" class="w-32 rounded shadow-lg">
                <div>
                    <h2 id="modal-title" class="text-2xl font-black uppercase leading-none mb-2"></h2>
                    <p id="modal-author" class="text-sm text-gray-400 font-bold uppercase mb-4"></p>
                    <div class="flex gap-3 mb-4">
                        <span id="modal-rank" class="text-green-400 font-black border border-green-400 px-2 py-0.5 rounded text-xs">98% Match</span>
                        <span id="modal-pages" class="text-gray-300 text-xs py-0.5"></span>
                    </div>
                    <p class="text-gray-400 text-xs leading-relaxed">The committee has spoken. This title has been ranked, judged, and categorized for your viewing pleasure.</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const SHEET_ID = '13bOmsDf8HibgVqyfcKWoH7SZPxk3k3ZIIOf--mduqbU';
        
        async function load() {
            const res = await fetch(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=0`);
            const csv = await res.text();
            const rows = csv.split('\n').map(row => row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/));
            
            const allBooks = rows.slice(1).map((c, i) => {
                const rRaw = (c[11]||"").replace(/"/g,"").trim();
                return { 
                    order: parseInt(c[0])||(i+1), 
                    title: (c[1]||"").replace(/"/g,"").trim(), 
                    author: (c[2]||"").replace(/"/g,"").trim(),
                    rank: rRaw && rRaw!=="N/A" ? parseInt(rRaw) : 999,
                    pages: parseInt((c[39]||"").replace(/\D/g,""))||0,
                    image: `covers/${parseInt(c[0])||(i+1)}.jpg`,
                    genre: (c[17]||"").replace(/"/g,"").trim()
                };
            }).filter(b => b.title && b.title !== "Book");

            // 1. Build Hero (The #1 Ranked Book)
            const numberOne = allBooks.find(b => b.rank === 1) || allBooks[0];
            document.getElementById('hero-section').innerHTML = `
                <div class="absolute inset-0">
                    <img src="${numberOne.image}" class="w-full h-full object-cover opacity-50 blur-sm">
                    <div class="absolute inset-0 hero-gradient"></div>
                </div>
                <div class="relative z-20 text-center mt-20">
                    <img src="${numberOne.image}" class="w-48 md:w-64 rounded-lg shadow-2xl mx-auto mb-6 hover:scale-105 transition duration-500">
                    <div class="flex justify-center gap-3 mb-4">
                         <span class="bg-red-600 text-white text-[10px] font-bold px-2 py-1 rounded">#1 RANKED</span>
                         <span class="bg-white text-black text-[10px] font-bold px-2 py-1 rounded">OFFICIAL SELECTION</span>
                    </div>
                    <h1 class="text-4xl md:text-6xl font-black uppercase tracking-tighter mb-2 drop-shadow-lg">${numberOne.title}</h1>
                    <p class="text-gray-300 font-bold uppercase tracking-widest text-sm mb-8">${numberOne.author}</p>
                    <button class="bg-white text-black px-8 py-3 rounded font-bold hover:bg-gray-200 transition flex items-center gap-2 mx-auto" onclick="openModal('${numberOne.title.replace(/'/g, "\\'")}', '${numberOne.author}', ${numberOne.rank}, '${numberOne.image}', ${numberOne.pages})">
                        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z"/></svg> Play Details
                    </button>
                </div>
            `;

            // 2. Build Rows
            
            // Top Ranked (Sorted by Rank)
            const topRated = [...allBooks].sort((a,b) => a.rank - b.rank).filter(b => b.rank !== 999).slice(0, 15);
            renderRow('row-top', topRated);

            // Latest (Sorted by Order DESC)
            const latest = [...allBooks].sort((a,b) => b.order - a.order).slice(0, 15);
            renderRow('row-latest', latest);

            // Sweet Spot (Pages < 350)
            const shorties = allBooks.filter(b => b.pages > 0 && b.pages < 350).sort((a,b) => a.rank - b.rank).slice(0, 15);
            renderRow('row-short', shorties);

            // Fiction
            const fiction = allBooks.filter(b => b.genre.toLowerCase().includes('fiction') && !b.genre.toLowerCase().includes('non')).sort((a,b) => a.rank - b.rank).slice(0, 15);
            renderRow('row-fiction', fiction);
        }

        function renderRow(id, books) {
            const container = document.getElementById(id);
            container.innerHTML = books.map(b => `
                <div class="book-card" onclick="openModal('${b.title.replace(/'/g, "\\'")}', '${b.author}', ${b.rank}, '${b.image}', ${b.pages})">
                    <img src="${b.image}" class="w-full h-auto rounded" onerror="this.src='https://placehold.jp/30/333333/ffffff/400x600.png?text=Cover';">
                    <div class="info-overlay">
                        <p class="text-green-400 font-black text-lg">#${b.rank===999?'NR':b.rank}</p>
                        <p class="text-[10px] font-bold uppercase mt-1 leading-tight">${b.title}</p>
                    </div>
                </div>
            `).join('');
        }

        function openModal(t, a, r, i, p) {
            document.getElementById('modal-img').src = i;
            document.getElementById('modal-title').innerText = t;
            document.getElementById('modal-author').innerText = a;
            document.getElementById('modal-rank').innerText = r === 999 ? 'Unranked' : 'Rank #' + r;
            document.getElementById('modal-pages').innerText = p + ' pgs';
            document.getElementById('modal').classList.add('active');
        }

        load();
    </script>
</body>
</html>
