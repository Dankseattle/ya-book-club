<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ya Book Club</title>
    <link rel="icon" type="image/png" href="clublogo.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; }
        .stats-bar { background: #ffffff; border-bottom: 1px solid #e2e8f0; }
        .sticky-header { position: sticky; top: 40px; z-index: 40; background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); border-bottom: 1px solid #e2e8f0; }
        .book-card { transition: all 0.3s ease; border-radius: 1.25rem; display: flex; flex-direction: column; height: 100%; overflow: hidden; border: 1px solid #e2e8f0; background: white; cursor: pointer; position: relative; }
        .book-card:hover { transform: translateY(-5px); box-shadow: 0 12px 20px -10px rgba(0, 0, 0, 0.1); }
        .btn-active { background-color: #2563eb !important; color: white !important; border-color: #2563eb !important; }
        #modal { display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.6); z-index: 50; align-items: center; justify-content: center; padding: 1rem; backdrop-filter: blur(8px); }
        #modal.active { display: flex; }
        .top-ten { border: 2px solid #fbbf24 !important; }
        .crop-square { width: 100%; height: 100%; object-fit: cover; object-position: center; }
        .hidden-section { display: none !important; }
        .genre-tag { position: absolute; top: 10px; left: 10px; background: rgba(255, 255, 255, 0.9); padding: 2px 8px; border-radius: 6px; font-size: 7px; font-weight: 900; text-transform: uppercase; color: #2563eb; letter-spacing: 0.05em; z-index: 10; }
        @keyframes pulse-border {
            0% { box-shadow: 0 0 0 0 rgba(37, 99, 235, 0.3); }
            70% { box-shadow: 0 0 0 8px rgba(37, 99, 235, 0); }
            100% { box-shadow: 0 0 0 0 rgba(37, 99, 235, 0); }
        }
        .reading-pulse { animation: pulse-border 2s infinite; border: 2px solid #2563eb !important; }
    </style>
</head>
<body>

    <div class="stats-bar py-2 px-4 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto flex justify-between items-center text-[9px] font-bold uppercase tracking-widest">
            <div class="flex gap-6 items-center">
                <span class="text-slate-400">Books <span id="stat-count" class="text-slate-900 ml-1">—</span></span>
                <span class="text-slate-400">Pages <span id="stat-pages" class="text-slate-900 ml-1">—</span></span>
                <span class="text-slate-400">Time <span id="stat-mins" class="text-slate-900 ml-1">—</span></span>
            </div>
            <div class="hidden sm:flex items-center gap-2"><span class="w-1.5 h-1.5 bg-green-500 rounded-full"></span><span class="text-slate-400">YA DOOD ANALYTICS</span></div>
        </div>
    </div>

    <header class="bg-white pt-8 pb-6 px-4 text-center sticky-header">
        <div class="flex justify-center mb-6">
            <img src="clublogo.png" alt="YA BOOK CLUB" class="h-14 md:h-16 w-auto object-contain" onerror="this.style.display='none';">
        </div>
        <div class="flex justify-center gap-8 mb-8">
            <button onclick="showSection('library')" id="nav-library" class="text-[10px] font-black uppercase tracking-[0.2em] text-slate-900 border-b-2 border-blue-600 pb-1">The Library</button>
            <button onclick="showSection('about')" id="nav-about" class="text-[10px] font-black uppercase tracking-[0.2em] text-slate-400 hover:text-slate-900 transition pb-1">The Committee</button>
        </div>
        <div id="controls" class="max-w-4xl mx-auto space-y-4 px-4">
            <div class="flex flex-col md:flex-row gap-3 justify-center items-center">
                <input type="text" id="searchInput" placeholder="Search..." class="px-5 py-2.5 border border-slate-200 rounded-xl w-full md:w-72 shadow-sm text-sm outline-none focus:ring-2 focus:ring-blue-500 bg-white">
                <div class="flex gap-2">
                    <button onclick="setSort('rank')" id="sort-rank" class="btn-active px-4 py-2.5 rounded-xl font-bold border border-slate-200 text-[10px] uppercase">Rank</button>
                    <button onclick="setSort('order')" id="sort-order" class="bg-white px-4 py-2.5 rounded-xl font-bold border border-slate-200 text-slate-500 text-[10px] uppercase">Order</button>
                    <button onclick="setSort('title')" id="sort-title" class="bg-white px-4 py-2.5 rounded-xl font-bold border border-slate-200 text-slate-500 text-[10px] uppercase">A-Z</button>
                </div>
            </div>
        </div>
    </header>

    <main id="library-section" class="max-w-7xl mx-auto p-6">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-12">
            <div id="feature-reading"></div>
            <div id="feature-next"></div>
        </div>
        <div id="grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-5"></div>
    </main>

    <main id="about-section" class="max-w-6xl mx-auto p-6 hidden-section">
        <div class="mb-12">
            <h2 class="text-sm font-black uppercase tracking-widest text-slate-400 mb-6 text-center italic">Deep Club Intelligence</h2>
            <div id="insights-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                </div>
        </div>

        <div id="member-profiles" class="grid grid-cols-1 md:grid-cols-2 gap-8"></div>
    </main>

    <div id="modal" onclick="closeModal()">
        <div id="modal-content" class="bg-white w-full max-w-lg rounded-[2.5rem] overflow-hidden shadow-2xl relative" onclick="event.stopPropagation()">
            <button onclick="closeModal()" class="absolute top-6 right-6 bg-slate-100 w-10 h-10 rounded-full flex items-center justify-center font-bold text-slate-500 hover:bg-slate-200 z-10">✕</button>
            <div class="p-8">
                <div class="flex flex-col items-center text-center mb-6">
                    <div class="w-48 h-48 bg-slate-50 rounded-2xl overflow-hidden shadow-lg mb-4"><img id="modal-img" src="" class="crop-square"></div>
                    <span id="modal-genre" class="inline-block px-3 py-1 bg-blue-50 text-blue-600 text-[9px] font-black rounded-full uppercase tracking-widest mb-2"></span>
                    <h2 id="modal-title" class="text-2xl font-black uppercase leading-tight text-slate-900 mb-1"></h2>
                    <p id="modal-author" class="text-sm font-bold text-slate-400 uppercase tracking-widest"></p>
                </div>
                <div id="modal-stats" class="grid grid-cols-2 gap-3 mb-6"></div>
                <div id="modal-ranks" class="grid grid-cols-5 gap-2"></div>
            </div>
        </div>
    </div>

    <script>
        let allData = [];
        let sortMode = 'rank';
        const SHEET_ID = '13bOmsDf8HibgVqyfcKWoH7SZPxk3k3ZIIOf--mduqbU';
        const DATA_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=0`;
        const members = [{id:'kirk', name:'Kirk'},{id:'huber', name:'Huber'},{id:'lattanzio', name:'Lattanzio'},{id:'walco', name:'Walco'},{id:'driscoll', name:'Driscoll'}];

        function formatTime(totalMins) {
            if (!totalMins) return "N/A";
            const h = Math.floor(totalMins/60), m = totalMins%60;
            return h > 0 ? `${h}h ${m}m` : `${m}m`;
        }

        async function load() {
            try {
                const res = await fetch(DATA_URL);
                const csvText = await res.text();
                const rows = csvText.split('\n').map(row => row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/));
                let totalP = 0, totalM = 0, completed = 0;

                allData = rows.slice(1).map((col, index) => {
                    const order = parseInt(col[0]) || (index + 1);
                    const rankRaw = (col[11] || "").replace(/"/g, "").trim();
                    const hasRank = rankRaw !== "" && rankRaw !== "N/A";
                    const pg = parseInt((col[39]||"").replace(/\D/g,"")) || 0;
                    const ln = parseInt((col[40]||"").replace(/\D/g,"")) || 0;
                    if (hasRank) { totalP += pg; totalM += ln; completed++; }

                    return {
                        order, title: (col[1]||"").replace(/"/g, ""), author: (col[2]||"").replace(/"/g, ""),
                        kirk: parseInt(col[3])||999, huber: parseInt(col[4])||999, lattanzio: parseInt(col[5])||999,
                        walco: parseInt(col[6])||999, driscoll: parseInt(col[7])||999, rank: hasRank ? parseInt(rankRaw) : 999,
                        selector: (col[16]||"").replace(/"/g, "").trim(), genre: (col[17]||"").replace(/"/g, "").trim() || "Other",
                        pages: pg, length: ln, status: (col[41]||"").trim().toLowerCase(), image: `covers/${order}.jpg`
                    };
                }).filter(b => b.title && (b.rank !== 999 || b.status));

                document.getElementById('stat-count').innerText = completed;
                document.getElementById('stat-pages').innerText = totalP.toLocaleString();
                document.getElementById('stat-mins').innerText = formatTime(totalM);
                
                runDeepIntelligence();
                renderFeatures();
                render();
            } catch (e) { console.error(e); }
        }

        function runDeepIntelligence() {
            const insights = [];
            const rankedOnly = allData.filter(b => b.rank !== 999);

            // 1. Taste Twins (Agreement Matrix)
            let bestPair = {p1:'', p2:'', score: 1000}, worstPair = {p1:'', p2:'', score: 0};
            for (let i=0; i<members.length; i++) {
                for (let j=i+1; j<members.length; j++) {
                    let diffSum = 0, count = 0;
                    rankedOnly.forEach(b => {
                        if(b[members[i].id] !== 999 && b[members[j].id] !== 999) {
                            diffSum += Math.abs(b[members[i].id] - b[members[j].id]);
                            count++;
                        }
                    });
                    const avg = diffSum / count;
                    if(avg < bestPair.score) bestPair = {p1:members[i].name, p2:members[j].name, score: avg};
                    if(avg > worstPair.score) worstPair = {p1:members[i].name, p2:members[j].name, score: avg};
                }
            }
            insights.push({title: 'Taste Twins', val: `${bestPair.p1} & ${bestPair.p2}`, desc: 'Statistically the most similar tastes in the club.', icon: '🤝'});
            insights.push({title: 'The Rivals', val: `${worstPair.p1} vs ${worstPair.p2}`, desc: 'Total opposites. If one loves it, the other usually hates it.', icon: '⚔️'});

            // 2. Elitism Trend
            const midPoint = Math.floor(rankedOnly.length/2);
            const earlyAvg = rankedOnly.slice(0, midPoint).reduce((a,b)=>a+b.rank,0)/midPoint;
            const lateAvg = rankedOnly.slice(midPoint).reduce((a,b)=>a+b.rank,0)/midPoint;
            const trendText = lateAvg > earlyAvg ? 'Harder to Please' : 'Finding Better Books';
            insights.push({title: 'Club Culture', val: trendsetter = trendText, desc: `Average group score has shifted from ${Math.round(earlyAvg)} to ${Math.round(lateAvg)}.`, icon: '📈'});

            // 3. Golden Page Count
            const ranges = {short: {min:0, max:300, sum:0, cnt:0}, mid: {min:301, max:450, sum:0, cnt:0}, long: {min:451, max:2000, sum:0, cnt:0}};
            rankedOnly.forEach(b => {
                if(b.pages <= 300) {ranges.short.sum += b.rank; ranges.short.cnt++;}
                else if(b.pages <= 450) {ranges.mid.sum += b.rank; ranges.mid.cnt++;}
                else {ranges.long.sum += b.rank; ranges.long.cnt++;}
            });
            let bestRange = Object.entries(ranges).sort((a,b) => (a[1].sum/a[1].cnt) - (b[1].sum/b[1].cnt))[0];
            insights.push({title: 'The Sweet Spot', val: bestRange[0].toUpperCase(), desc: `Books in this length range statistically rank the highest with the group.`, icon: '📏'});

            // 4. Hero vs Ego (Crowd Pleaser)
            let hero = {name:'', diff: 0};
            members.forEach(m => {
                const picks = rankedOnly.filter(b => b.selector.toLowerCase().includes(m.name.toLowerCase()));
                if(picks.length > 0) {
                    const avgPickRank = picks.reduce((s,b)=>s+b.rank,0)/picks.length;
                    const selfRank = picks.reduce((s,b)=>s+b[m.id],0)/picks.length;
                    const diff = selfRank - avgPickRank; // Positive means group liked it more than the selector
                    if(diff > hero.diff) hero = {name: m.name, diff};
                }
            });
            insights.push({title: 'The Crowd Pleaser', val: hero.name, desc: 'Picks books that the group ends up loving even more than they do.', icon: '🌟'});

            document.getElementById('insights-grid').innerHTML = insights.map(i => `
                <div class="bg-white p-6 rounded-[2rem] border border-slate-100 shadow-sm">
                    <div class="text-2xl mb-2">${i.icon}</div>
                    <p class="text-[9px] font-black text-blue-600 uppercase tracking-widest">${i.title}</p>
                    <h3 class="text-xl font-black uppercase italic my-1">${i.val}</h3>
                    <p class="text-xs text-slate-400 leading-relaxed">${i.desc}</p>
                </div>
            `).join('');

            // Member Profiles logic
            document.getElementById('member-profiles').innerHTML = members.map(m => {
                const readCount = rankedOnly.filter(b => b[m.id] !== 999).length;
                const top5 = rankedOnly.filter(b => b[m.id] <= 5).sort((a,b)=>a[m.id]-b[m.id]).slice(0,5);
                const picks = rankedOnly.filter(b => b.selector.toLowerCase().includes(m.name.toLowerCase())).length;
                return `<div class="bg-white p-8 rounded-[2.5rem] border border-slate-100 shadow-sm">
                    <h3 class="text-2xl font-black uppercase italic">${m.name}</h3>
                    <div class="flex gap-4 mt-1 mb-6 text-[9px] font-bold text-slate-400 uppercase tracking-widest">
                        <span>Ranked: ${readCount}</span><span>Picks: ${picks}</span>
                    </div>
                    <div class="grid grid-cols-5 gap-2">
                        ${top5.map(b => `<img src="${b.image}" class="aspect-square rounded-lg object-cover cursor-pointer hover:scale-105 transition" onclick="openModal(${b.order})">`).join('')}
                    </div>
                </div>`;
            }).join('');
        }

        function renderFeatures() {
            const rd = allData.find(b => b.status === 'reading'), nx = allData.find(b => b.status === 'next');
            if(rd) document.getElementById('feature-reading').innerHTML = `<div class="text-[9px] font-black uppercase text-blue-600 mb-2">Reading Now</div><div class="bg-white p-5 rounded-[2rem] border-2 border-blue-600 flex items-center gap-4 reading-pulse cursor-pointer" onclick="openModal(${rd.order})"><img src="${rd.image}" class="w-16 h-16 rounded-xl object-cover"><div class="text-left"><h3 class="font-black text-sm uppercase leading-none mb-1">${rd.title}</h3><p class="text-[10px] text-slate-400 uppercase font-bold">${rd.author}</p></div></div>`;
            if(nx) document.getElementById('feature-next').innerHTML = `<div class="text-[9px] font-black uppercase text-slate-400 mb-2">Up Next</div><div class="bg-white p-5 rounded-[2rem] border border-slate-200 flex items-center gap-4 opacity-70 cursor-pointer" onclick="openModal(${nx.order})"><img src="${nx.image}" class="w-16 h-16 rounded-xl object-cover grayscale"><div class="text-left"><h3 class="font-black text-sm uppercase leading-none mb-1">${nx.title}</h3><p class="text-[10px] text-slate-300 uppercase font-bold">${nx.author}</p></div></div>`;
        }

        function openModal(id) {
            const b = allData.find(x => x.order === id); if(!b) return;
            document.getElementById('modal-img').src = b.image;
            document.getElementById('modal-title').innerText = b.title;
            document.getElementById('modal-author').innerText = b.author;
            document.getElementById('modal-genre').innerText = b.genre;
            document.getElementById('modal-stats').innerHTML = `
                <div class="bg-slate-50 p-3 rounded-xl text-center"><p class="text-[8px] font-black uppercase text-slate-400">Pages</p><p class="text-xs font-black">${b.pages}</p></div>
                <div class="bg-slate-900 p-3 rounded-xl text-center text-white"><p class="text-[8px] font-black uppercase text-slate-400">Consensus</p><p class="text-xs font-black italic">#${b.rank===999?'N/A':b.rank}</p></div>
            `;
            document.getElementById('modal-ranks').innerHTML = members.map(m => `
                <div class="bg-white p-2 rounded-lg border text-center"><p class="text-[7px] font-bold text-slate-400 uppercase">${m.name}</p><p class="text-xs font-black">${b[m.id]===999?'--':b[m.id]}</p></div>
            `).join('');
            document.getElementById('modal').classList.add('active');
        }

        function closeModal() { document.getElementById('modal').classList.remove('active'); }
        function showSection(s) { document.getElementById('library-section').classList.toggle('hidden-section', s!=='library'); document.getElementById('about-section').classList.toggle('hidden-section', s!=='about'); }
        function setSort(s) { sortMode = s; render(); }

        function render() {
            const grid = document.getElementById('grid');
            const search = document.getElementById('searchInput').value.toLowerCase();
            let items = allData.filter(b => b.title.toLowerCase().includes(search) || b.author.toLowerCase().includes(search));
            if(sortMode==='order') items.sort((a,b)=>a.order-b.order); else if(sortMode==='title') items.sort((a,b)=>a.title.localeCompare(b.title)); else items.sort((a,b)=>a[sortMode]-b[sortMode]);

            grid.innerHTML = items.map(b => `
                <div class="book-card" onclick="openModal(${b.order})">
                    <div class="genre-tag">${b.genre}</div>
                    <div class="aspect-square overflow-hidden"><img src="${b.image}" class="crop-square" onerror="this.src='https://placehold.jp/24/e2e8f0/94a3b8/400x600.png?text=${b.order}';"></div>
                    <div class="p-4 flex flex-col flex-grow">
                        <div class="flex-grow mb-3"><h3 class="font-black text-[10px] uppercase leading-tight line-clamp-2">${b.title}</h3><p class="text-[8px] font-bold text-blue-600 uppercase mt-1">${b.author}</p></div>
                        <div class="flex justify-between items-end border-t pt-2"><p class="text-[9px] font-black text-slate-900 italic">#${b.rank===999?'N/A':b.rank}</p><p class="text-[8px] font-bold text-slate-300">ORD ${b.order}</p></div>
                    </div>
                </div>
            `).join('');
        }
        document.getElementById('searchInput').addEventListener('input', render);
        load();
    </script>
</body>
</html>
