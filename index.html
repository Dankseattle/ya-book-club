<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ya Book Club Library</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .book-card { transition: all 0.3s ease; }
        .book-card:hover { transform: translateY(-5px); shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">

    <header class="bg-white border-b border-slate-200 py-8 px-4 mb-8">
        <div class="max-w-6xl mx-auto text-center">
            <h1 class="text-4xl font-extrabold tracking-tight text-slate-900">Ya Book Club</h1>
            <p class="text-slate-500 mt-2">100+ Books Ranked and Reviewed</p>
            
            <div class="mt-8 flex flex-col md:flex-row gap-4 justify-center">
                <input type="text" id="searchInput" placeholder="Search books or authors..." 
                    class="px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none w-full md:w-64">
                
                <div class="flex gap-2 justify-center">
                    <button onclick="renderBooks('consensus')" class="bg-slate-800 text-white px-4 py-2 rounded-lg hover:bg-slate-700 transition">Sort by Rank</button>
                    <button onclick="renderBooks('title')" class="bg-white border border-slate-300 px-4 py-2 rounded-lg hover:bg-slate-50 transition">A-Z</button>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto p-4">
        <div id="book-container" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-6">
            <div class="col-span-full text-center py-20 text-slate-400">Loading the library...</div>
        </div>
    </main>

    <script>
        let allBooks = [];
        const SHEET_ID = '13bOmsDf8HibgVqyfcKWoH7SZPxk3k3ZIIOf--mduqbU';
        const JSON_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json`;

        async function loadData() {
            try {
                const response = await fetch(JSON_URL);
                const text = await response.text();
                const json = JSON.parse(text.substr(47).slice(0, -2));
                const rows = json.table.rows;

                // Map the Google Sheet rows to clean objects
                allBooks = rows.map(row => ({
                    title: row.c[0]?.v || "Untitled",
                    author: row.c[1]?.v || "Unknown",
                    rank: parseFloat(row.c[11]?.v) || 999, // Consensus Rank
                    image: row.c[12]?.v || "https://via.placeholder.com/200x300?text=No+Cover"
                })).filter(b => b.title !== "Book"); // Filter out header row

                renderBooks('consensus');
            } catch (e) {
                document.getElementById('book-container').innerHTML = "Error loading data. Check Sheet sharing.";
            }
        }

        function renderBooks(sortBy = 'consensus') {
            const container = document.getElementById('book-container');
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            
            let filtered = allBooks.filter(b => 
                b.title.toLowerCase().includes(searchTerm) || 
                b.author.toLowerCase().includes(searchTerm)
            );

            if (sortBy === 'consensus') filtered.sort((a, b) => a.rank - b.rank);
            if (sortBy === 'title') filtered.sort((a, b) => a.title.localeCompare(b.title));

            container.innerHTML = filtered.map(book => `
                <div class="book-card bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden flex flex-col">
                    <div class="aspect-[2/3] overflow-hidden bg-slate-200">
                        <img src="${book.image}" alt="${book.title}" class="w-full h-full object-cover" onerror="this.src='https://via.placeholder.com/200x300?text=Check+Image+Link'">
                    </div>
                    <div class="p-3 flex-grow">
                        <div class="text-xs font-bold text-blue-600 mb-1">RANK #${book.rank}</div>
                        <h3 class="font-bold text-sm leading-tight text-slate-800 line-clamp-2">${book.title}</h3>
                        <p class="text-xs text-slate-500 mt-1">${book.author}</p>
                    </div>
                </div>
            `).join('');
        }

        document.getElementById('searchInput').addEventListener('input', () => renderBooks('consensus'));
        loadData();
    </script>
</body>
</html>
