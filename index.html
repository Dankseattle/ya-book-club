<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ya Book Club</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .book-card { transition: all 0.3s ease; border-radius: 1.5rem; display: flex; flex-direction: column; height: 100%; overflow: hidden; border: 1px solid #e2e8f0; background: white; cursor: pointer; }
        .book-card:hover { transform: translateY(-5px); box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1); }
        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .btn-active { background-color: #0f172a !important; color: white !important; border-color: #0f172a !important; }
        
        /* Modal Styles */
        #modal { display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.8); z-index: 50; align-items: center; justify-content: center; padding: 1rem; backdrop-filter: blur(4px); }
        #modal.active { display: flex; }
    </style>
</head>
<body>

    <header class="bg-white border-b py-10 px-4 text-center">
        <h1 class="text-5xl font-black italic uppercase tracking-tighter mb-2 text-slate-900 leading-none">YA BOOK CLUB</h1>
        <p id="book-count" class="text-[10px] font-bold text-slate-400 uppercase tracking-[0.2em] mb-6 text-center">Syncing...</p>
        
        <div class="max-w-5xl mx-auto space-y-6">
            <div class="flex flex-col md:flex-row gap-3 justify-center">
                <input type="text" id="searchInput" placeholder="Search title or author..." class="px-5 py-3 border rounded-xl w-full md:w-80 shadow-sm outline-none focus:ring-2 focus:ring-blue-500">
                <div class="flex gap-2 justify-center">
                    <button onclick="setSort('order')" id="sort-order" class="btn-active px-5 py-3 rounded-xl font-bold border shadow-sm transition uppercase text-xs">Order</button>
                    <button onclick="setSort('rank')" id="sort-rank" class="bg-white px-5 py-3 rounded-xl font-bold border shadow-sm transition text-slate-500 uppercase text-xs">Rank</button>
                    <button onclick="setSort('title')" id="sort-title" class="bg-white px-5 py-3 rounded-xl font-bold border shadow-sm transition text-slate-500 uppercase text-xs">A-Z</button>
                </div>
            </div>
            <div class="flex gap-2 justify-center">
                <button onclick="setGenre('All')" id="gen-All" class="btn-active px-4 py-1.5 rounded-full text-[10px] font-bold border transition">ALL</button>
                <button onclick="setGenre('Fiction')" id="gen-Fiction" class="bg-white px-4 py-1.5 rounded-full text-[10px] font-bold border transition text-slate-500">FICTION</button>
                <button onclick="setGenre('Non-Fiction')" id="gen-Non-Fiction" class="bg-white px-4 py-1.5 rounded-full text-[10px] font-bold border transition text-slate-500">NON-FICTION</button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-6">
        <div id="grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-6"></div>
    </main>

    <div id="modal" onclick="closeModal()">
        <div class="bg-white w-full max-w-lg rounded-[2rem] overflow-hidden shadow-2xl relative" onclick="event.stopPropagation()">
            <button onclick="closeModal()" class="absolute top-4 right-4 bg-slate-100 w-10 h-10 rounded-full flex items-center justify-center font-bold text-slate-500 hover:bg-slate-200">✕</button>
            
            <div class="p-8">
                <div class="flex gap-6 mb-8">
                    <div class="w-1/3 aspect-[2/3] bg-slate-100 rounded-xl overflow-hidden shadow-md">
                        <img id="modal-img" src="" class="w-full h-full object-cover">
                    </div>
                    <div class="w-2/3">
                        <span id="modal-genre" class="inline-block px-2 py-0.5 bg-blue-50 text-blue-600 text-[10px] font-black rounded uppercase tracking-widest mb-2"></span>
                        <h2 id="modal-title" class="text-2xl font-black uppercase leading-none text-slate-900 mb-1"></h2>
                        <p id="modal-author" class="text-sm font-bold text-slate-400 uppercase tracking-wider mb-4"></p>
                        
                        <div class="flex gap-4">
                            <div class="bg-slate-50 p-3 rounded-xl flex-1 text-center border border-slate-100">
                                <p class="text-[9px] font-black text-slate-400 uppercase leading-none mb-1">Order</p>
                                <p id="modal-order" class="text-lg font-black text-slate-900"></p>
                            </div>
                            <div class="bg-slate-900 p-3 rounded-xl flex-1 text-center shadow-lg">
                                <p class="text-[9px] font-black text-slate-400 uppercase leading-none mb-1">Consensus</p>
                                <p id="modal-consensus" class="text-lg font-black text-white italic"></p>
                            </div>
                        </div>
                    </div>
                </div>

                <h3 class="font-black text-xs uppercase tracking-[0.2em] text-slate-300 border-b pb-2 mb-4 text-center">Individual Rankings</h3>
                <div class="grid grid-cols-3 gap-3">
                    <div class="bg-slate-50 p-4 rounded-2xl text-center border border-slate-100">
                        <p class="text-[10px] font-black text-slate-400 uppercase mb-1">Kirk</p>
                        <p id="rank-kirk" class="text-xl font-black text-slate-900">--</p>
                    </div>
                    <div class="bg-slate-50 p-4 rounded-2xl text-center border border-slate-100">
                        <p class="text-[10px] font-black text-slate-400 uppercase mb-1">Huber</p>
                        <p id="rank-huber" class="text-xl font-black text-slate-900">--</p>
                    </div>
                    <div class="bg-slate-50 p-4 rounded-2xl text-center border border-slate-100">
                        <p class="text-[10px] font-black text-slate-400 uppercase mb-1">Latz</p>
                        <p id="rank-latz" class="text-xl font-black text-slate-900">--</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let allData = [];
        let sortMode = 'order';
        let filterGenre = 'All';

        const SHEET_ID = '13bOmsDf8HibgVqyfcKWoH7SZPxk3k3ZIIOf--mduqbU';
        const DATA_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=0`;

        async function load() {
            try {
                const res = await fetch(DATA_URL);
                const csvText = await res.text();
                const rows = csvText.split('\n').map(row => row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/));

                allData = rows.slice(1).map((col, index) => {
                    const order = parseInt(col[0]) || (index + 1);
                    return {
                        order: order,
                        title: (col[1] || "").replace(/"/g, "").trim(),
                        author: (col[2] || "").replace(/"/g, "").trim(),
                        kirk: (col[8] || "").replace(/"/g, "").trim(),   // Column I
                        huber: (col[9] || "").replace(/"/g, "").trim(),  // Column J
                        latz: (col[10] || "").replace(/"/g, "").trim(),   // Column K
                        rank: (col[11] || "").replace(/"/g, "").trim() || "N/A", // Column L
                        genre: (col[17] || "").replace(/"/g, "").trim() || "Other",
                        image: `covers/${order}.jpg`
                    };
                }).filter(b => b.title !== "" && b.title !== "Book");

                document.getElementById('book-count').innerText = `${allData.length} Books in Collection`;
                render();
            } catch (e) { console.error(e); }
        }

        function setSort(s) { sortMode = s; render(); }
        function setGenre(g) { filterGenre = g; render(); }

        function openModal(index) {
            const b = allData.find(x => x.order === index);
            if(!b) return;
            document.getElementById('modal-img').src = b.image;
            document.getElementById('modal-title').innerText = b.title;
            document.getElementById('modal-author').innerText = b.author;
            document.getElementById('modal-genre').innerText = b.genre;
            document.getElementById('modal-order').innerText = b.order;
            document.getElementById('modal-consensus').innerText = "#" + b.rank;
            document.getElementById('rank-kirk').innerText = b.kirk || "--";
            document.getElementById('rank-huber').innerText = b.huber || "--";
            document.getElementById('rank-latz').innerText = b.latz || "--";
            document.getElementById('modal').classList.add('active');
        }

        function closeModal() { document.getElementById('modal').classList.remove('active'); }

        function render() {
            const container = document.getElementById('grid');
            const search = document.getElementById('searchInput').value.toLowerCase();

            ['order', 'rank', 'title'].forEach(id => {
                const btn = document.getElementById('sort-'+id);
                btn.className = sortMode === id ? "btn-active px-5 py-3 rounded-xl font-bold border shadow-sm transition text-xs" : "bg-white px-5 py-3 rounded-xl font-bold border shadow-sm text-slate-500 transition text-xs";
            });

            let items = allData.filter(b => (filterGenre === 'All' || b.genre === filterGenre) && (b.title.toLowerCase().includes(search) || b.author.toLowerCase().includes(search)));
            if (sortMode === 'order') items.sort((a,b) => a.order - b.order);
            else if (sortMode === 'rank') items.sort((a,b) => (parseInt(a.rank) || 999) - (parseInt(b.rank) || 999));
            else items.sort((a,b) => a.title.localeCompare(b.title));

            container.innerHTML = items.map(b => `
                <div class="book-card shadow-sm" onclick="openModal(${b.order})">
                    <div class="aspect-[2/3] bg-slate-200">
                        <img src="${b.image}" alt="${b.title}" class="w-full h-full object-cover" onerror="this.src='https://placehold.jp/24/e2e8f0/94a3b8/400x600.png?text=${b.order}';">
                    </div>
                    <div class="p-4 flex flex-col flex-grow">
                        <div class="flex-grow mb-4">
                            <h3 class="font-black text-xs uppercase leading-tight line-clamp-2 text-slate-900">${b.title}</h3>
                            <p class="text-[10px] font-bold text-blue-600 mt-1 uppercase tracking-wider">${b.author}</p>
                            <span class="inline-block mt-2 px-2 py-0.5 bg-slate-100 text-slate-500 text-[8px] font-bold rounded uppercase tracking-widest">${b.genre}</span>
                        </div>
                        <div class="pt-3 border-t flex justify-between items-end">
                            <div class="text-left">
                                <p class="text-[7px] font-black text-slate-400 uppercase tracking-tighter">Order</p>
                                <p class="text-xs font-bold text-slate-700">${b.order}</p>
                            </div>
                            <div class="text-right">
                                <p class="text-[7px] font-black text-slate-400 uppercase tracking-tighter">Rank</p>
                                <p class="text-xs font-black italic text-slate-900">#${b.rank}</p>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }
        document.getElementById('searchInput').addEventListener('input', render);
        load();
    </script>
</body>
</html>
