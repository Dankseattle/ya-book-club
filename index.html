<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ya Book Club</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .sticky-header { position: sticky; top: 0; z-index: 40; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(8px); }
        .book-card { transition: all 0.3s ease; border-radius: 1.25rem; display: flex; flex-direction: column; height: 100%; overflow: hidden; border: 1px solid #e2e8f0; background: white; cursor: pointer; }
        .book-card:hover { transform: translateY(-5px); box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1); }
        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .btn-active { background-color: #0f172a !important; color: white !important; border-color: #0f172a !important; }
        #modal { display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.8); z-index: 50; align-items: center; justify-content: center; padding: 1rem; backdrop-filter: blur(4px); }
        #modal.active { display: flex; }
        .top-ten { border: 2px solid #fbbf24 !important; }
        .crop-square { width: 100%; height: 100%; object-fit: cover; object-position: center; }
    </style>
</head>
<body>

    <header class="bg-white border-b pt-10 pb-6 px-4 text-center sticky-header">
        <h1 class="text-4xl md:text-5xl font-black italic uppercase tracking-tighter mb-2 text-slate-900 leading-none">YA BOOK CLUB</h1>
        <p id="book-count" class="text-[10px] font-bold text-slate-400 uppercase tracking-[0.2em] mb-6 text-center italic">Syncing Database...</p>
        
        <div class="max-w-5xl mx-auto space-y-4">
            <div class="flex flex-col md:flex-row gap-3 justify-center items-center">
                <input type="text" id="searchInput" placeholder="Search title or author..." class="px-5 py-3 border rounded-xl w-full md:w-80 shadow-sm outline-none focus:ring-2 focus:ring-blue-500 bg-white">
                <div class="flex gap-2 flex-wrap justify-center">
                    <button onclick="setSort('rank')" id="sort-rank" class="btn-active px-5 py-3 rounded-xl font-bold border shadow-sm transition uppercase text-[10px]">Rank</button>
                    <button onclick="setSort('order')" id="sort-order" class="bg-white px-5 py-3 rounded-xl font-bold border shadow-sm transition text-slate-500 uppercase text-[10px]">Order</button>
                    <button onclick="setSort('title')" id="sort-title" class="bg-white px-5 py-3 rounded-xl font-bold border shadow-sm transition text-slate-500 uppercase text-[10px]">A-Z</button>
                    
                    <select id="rankSelector" onchange="setSort(this.value)" class="bg-white px-4 py-3 rounded-xl font-bold border shadow-sm text-slate-500 uppercase text-[10px] outline-none cursor-pointer">
                        <option value="" disabled selected>Individual Ranks</option>
                        <option value="kirk">Kirk</option>
                        <option value="huber">Huber</option>
                        <option value="lattanzio">Lattanzio</option>
                        <option value="walco">Walco</option>
                        <option value="driscoll">Driscoll</option>
                    </select>
                </div>
            </div>
            <div class="flex gap-2 justify-center">
                <button onclick="setGenre('All')" id="gen-All" class="btn-active px-4 py-1.5 rounded-full text-[10px] font-bold border transition">ALL</button>
                <button onclick="setGenre('Fiction')" id="gen-Fiction" class="bg-white px-4 py-1.5 rounded-full text-[10px] font-bold border transition text-slate-500">FICTION</button>
                <button onclick="setGenre('Non-Fiction')" id="gen-Non-Fiction" class="bg-white px-4 py-1.5 rounded-full text-[10px] font-bold border transition text-slate-500">NON-FICTION</button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-6">
        <div id="grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-4"></div>
    </main>

    <div id="modal" onclick="closeModal()">
        <div id="modal-content" class="bg-white w-full max-w-lg rounded-[2.5rem] overflow-hidden shadow-2xl relative" onclick="event.stopPropagation()">
            <button onclick="closeModal()" class="absolute top-6 right-6 bg-slate-100 w-10 h-10 rounded-full flex items-center justify-center font-bold text-slate-500 hover:bg-slate-200 z-10">✕</button>
            <div class="p-8">
                <div class="flex flex-col items-center text-center mb-6">
                    <div class="w-48 h-48 bg-slate-100 rounded-2xl overflow-hidden shadow-xl mb-4">
                        <img id="modal-img" src="" class="crop-square">
                    </div>
                    <div>
                        <span id="modal-genre" class="inline-block px-3 py-1 bg-blue-50 text-blue-600 text-[10px] font-black rounded-full uppercase tracking-widest mb-2"></span>
                        <h2 id="modal-title" class="text-2xl font-black uppercase leading-tight text-slate-900 mb-1"></h2>
                        <p id="modal-author" class="text-sm font-bold text-slate-400 uppercase tracking-widest"></p>
                    </div>
                </div>
                
                <div class="grid grid-cols-2 gap-3 mb-6">
                    <div class="bg-slate-50 p-3 rounded-2xl text-center border border-slate-100"><p class="text-[8px] font-black text-slate-400 uppercase mb-1">Order</p><p id="modal-order" class="text-sm font-black text-slate-900"></p></div>
                    <div id="consensus-box" class="bg-slate-900 p-3 rounded-2xl text-center shadow-lg"><p class="text-[8px] font-black text-slate-400 uppercase mb-1">Consensus</p><p id="modal-consensus" class="text-sm font-black text-white italic"></p></div>
                    <div class="bg-slate-50 p-3 rounded-2xl text-center border border-slate-100"><p class="text-[8px] font-black text-slate-400 uppercase mb-1">Pages</p><p id="modal-pages" class="text-sm font-black text-slate-900"></p></div>
                    <div class="bg-slate-50 p-3 rounded-2xl text-center border border-slate-100"><p class="text-[8px] font-black text-slate-400 uppercase mb-1">Audio Length</p><p id="modal-length" class="text-sm font-black text-slate-900"></p></div>
                </div>

                <h3 class="font-black text-xs uppercase tracking-[0.2em] text-slate-300 border-b pb-2 mb-4 text-center">Scoreboard</h3>
                <div class="grid grid-cols-3 sm:grid-cols-5 gap-2">
                    <div class="bg-slate-50 p-2 rounded-xl text-center border border-slate-100"><p class="text-[8px] font-black text-slate-400 uppercase">Kirk</p><p id="rank-kirk" class="text-sm font-black text-slate-900">--</p></div>
                    <div class="bg-slate-50 p-2 rounded-xl text-center border border-slate-100"><p class="text-[8px] font-black text-slate-400 uppercase">Huber</p><p id="rank-huber" class="text-sm font-black text-slate-900">--</p></div>
                    <div class="bg-slate-50 p-2 rounded-xl text-center border border-slate-100"><p class="text-[8px] font-black text-slate-400 uppercase">Lattanzio</p><p id="rank-lattanzio" class="text-sm font-black text-slate-900">--</p></div>
                    <div class="bg-slate-50 p-2 rounded-xl text-center border border-slate-100"><p class="text-[8px] font-black text-slate-400 uppercase">Walco</p><p id="rank-walco" class="text-sm font-black text-slate-900">--</p></div>
                    <div class="bg-slate-50 p-2 rounded-xl text-center border border-slate-100"><p class="text-[8px] font-black text-slate-400 uppercase">Driscoll</p><p id="rank-driscoll" class="text-sm font-black text-slate-900">--</p></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let allData = [];
        let sortMode = 'rank';
        let filterGenre = 'All';

        const SHEET_ID = '13bOmsDf8HibgVqyfcKWoH7SZPxk3k3ZIIOf--mduqbU';
        const DATA_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=0`;

        async function load() {
            try {
                const res = await fetch(DATA_URL);
                const csvText = await res.text();
                const rows = csvText.split('\n').map(row => row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/));
                allData = rows.slice(1).map((col, index) => {
                    const order = parseInt(col[0]) || (index + 1);
                    return {
                        order: order,
                        title: (col[1] || "").replace(/"/g, "").trim(),
                        author: (col[2] || "").replace(/"/g, "").trim(),
                        kirk: parseInt(col[3]) || 999,
                        huber: parseInt(col[4]) || 999,
                        lattanzio: parseInt(col[5]) || 999,
                        walco: parseInt(col[6]) || 999,
                        driscoll: parseInt(col[7]) || 999,
                        rank: parseInt(col[11]) || 999,
                        genre: (col[17] || "").replace(/"/g, "").trim() || "Other",
                        pages: (col[39] || "").replace(/"/g, "").trim() || "N/A",  
                        length: (col[40] || "").replace(/"/g, "").trim() || "N/A", 
                        image: `covers/${order}.jpg`
                    };
                }).filter(b => b.title !== "" && b.title !== "Book");
                document.getElementById('book-count').innerText = `${allData.length} Books in Collection`;
                render();
            } catch (e) { console.error(e); }
        }

        function setSort(s) { 
            sortMode = s; 
            // Reset dropdown if main buttons are clicked
            if(['rank', 'order', 'title'].includes(s)) {
                document.getElementById('rankSelector').selectedIndex = 0;
            }
            render(); 
        }

        function setGenre(g) { filterGenre = g; render(); }
        
        function openModal(index) {
            const b = allData.find(x => x.order === index);
            if(!b) return;
            const modalContent = document.getElementById('modal-content');
            const consensusBox = document.getElementById('consensus-box');
            if (b.rank <= 10 && b.rank > 0) {
                modalContent.classList.add('top-ten');
                consensusBox.style.backgroundColor = '#fbbf24';
            } else {
                modalContent.classList.remove('top-ten');
                consensusBox.style.backgroundColor = '#0f172a';
            }
            document.getElementById('modal-img').src = b.image;
            document.getElementById('modal-title').innerText = b.title;
            document.getElementById('modal-author').innerText = b.author;
            document.getElementById('modal-genre').innerText = b.genre;
            document.getElementById('modal-order').innerText = b.order;
            document.getElementById('modal-consensus').innerText = "#" + (b.rank === 999 ? "N/A" : b.rank);
            document.getElementById('modal-pages').innerText = b.pages !== "N/A" ? b.pages + " pgs" : "N/A";
            document.getElementById('modal-length').innerText = b.length !== "N/A" ? b.length + " mins" : "N/A";
            document.getElementById('rank-kirk').innerText = b.kirk === 999 ? "--" : b.kirk;
            document.getElementById('rank-huber').innerText = b.huber === 999 ? "--" : b.huber;
            document.getElementById('rank-lattanzio').innerText = b.lattanzio === 999 ? "--" : b.lattanzio;
            document.getElementById('rank-walco').innerText = b.walco === 999 ? "--" : b.walco;
            document.getElementById('rank-driscoll').innerText = b.driscoll === 999 ? "--" : b.driscoll;
            document.getElementById('modal').classList.add('active');
        }

        function closeModal() { document.getElementById('modal').classList.remove('active'); }

        function render() {
            const container = document.getElementById('grid');
            const search = document.getElementById('searchInput').value.toLowerCase();

            ['rank', 'order', 'title'].forEach(id => {
                const btn = document.getElementById('sort-'+id);
                btn.className = sortMode === id ? "btn-active px-5 py-3 rounded-xl font-bold border shadow-sm transition text-[10px]" : "bg-white px-5 py-3 rounded-xl font-bold border shadow-sm text-slate-500 transition text-[10px]";
            });
            ['All', 'Fiction', 'Non-Fiction'].forEach(id => {
                const btn = document.getElementById('gen-'+id);
                btn.className = filterGenre === id ? "btn-active px-4 py-1.5 rounded-full text-[10px] font-bold border transition shadow-sm" : "bg-white px-4 py-1.5 rounded-full text-[10px] font-bold border transition text-slate-500 shadow-sm";
            });

            let items = allData.filter(b => (filterGenre === 'All' || b.genre === filterGenre) && (b.title.toLowerCase().includes(search) || b.author.toLowerCase().includes(search)));
            
            if (sortMode === 'order') items.sort((a,b) => a.order - b.order);
            else if (sortMode === 'title') items.sort((a,b) => a.title.localeCompare(b.title));
            else items.sort((a,b) => a[sortMode] - b[sortMode]);

            container.innerHTML = items.map(b => {
                // Determine what label and value to show in the bottom right corner
                let cornerLabel = "Consensus";
                let cornerValue = b.rank;

                // If we are sorting by an individual person, show their rank
                if (['kirk', 'huber', 'lattanzio', 'walco', 'driscoll'].includes(sortMode)) {
                    cornerLabel = sortMode.toUpperCase();
                    cornerValue = b[sortMode];
                }

                return `
                <div class="book-card shadow-sm" onclick="openModal(${b.order})">
                    <div class="aspect-square bg-slate-100 overflow-hidden">
                        <img src="${b.image}" alt="${b.title}" class="crop-square" onerror="this.src='https://placehold.jp/24/e2e8f0/94a3b8/400x600.png?text=${b.order}';">
                    </div>
                    <div class="p-4 flex flex-col flex-grow">
                        <div class="flex-grow mb-3">
                            <h3 class="font-black text-[11px] uppercase leading-tight line-clamp-2 text-slate-900 mb-1">${b.title}</h3>
                            <p class="text-[9px] font-bold text-blue-600 uppercase tracking-tight truncate">${b.author}</p>
                        </div>
                        <div class="pt-2 border-t flex justify-between items-end">
                            <div class="text-left">
                                <p class="text-[7px] font-black text-slate-400 uppercase tracking-tighter">Order</p>
                                <p class="text-[10px] font-bold text-slate-700 leading-none">${b.order}</p>
                            </div>
                            <div class="text-right">
                                <p class="text-[7px] font-black text-slate-400 uppercase leading-none">${cornerLabel}</p>
                                <p class="text-[10px] font-black italic text-slate-900 leading-none">#${cornerValue === 999 ? 'N/A' : cornerValue}</p>
                            </div>
                        </div>
                    </div>
                </div>`;
            }).join('');
        }
        document.getElementById('searchInput').addEventListener('input', render);
        load();
    </script>
</body>
</html>
