<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ya Book Club Library</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .book-card { transition: all 0.3s ease; height: 100%; }
        .book-card:hover { transform: translateY(-5px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">

    <header class="bg-white border-b border-slate-200 py-10 px-4 mb-8 shadow-sm text-center">
        <h1 class="text-5xl font-extrabold tracking-tight text-slate-900 mb-2">Ya Book Club</h1>
        <p class="text-slate-500 text-lg">Official Rankings & Library</p>
        
        <div class="mt-8 flex flex-col md:flex-row gap-4 justify-center items-center max-w-4xl mx-auto">
            <input type="text" id="searchInput" placeholder="Search title or author..." 
                class="px-5 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none w-full md:w-80 shadow-sm">
            
            <div class="flex gap-2">
                <button onclick="changeSort('order')" id="sortOrder" class="bg-slate-900 text-white px-6 py-3 rounded-xl font-semibold shadow-md transition">Reading Order</button>
                <button onclick="changeSort('title')" id="sortTitle" class="bg-white border border-slate-300 px-6 py-3 rounded-xl font-semibold transition">A-Z Title</button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-4">
        <div id="book-container" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-6">
            <div class="col-span-full text-center py-20 text-slate-400 text-xl font-medium">Loading books...</div>
        </div>
    </main>

    <script>
        let allBooks = [];
        let currentSort = 'order';
        const SHEET_ID = '13bOmsDf8HibgVqyfcKWoH7SZPxk3k3ZIIOf--mduqbU';
        const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=0`;

        async function loadData() {
            try {
                const response = await fetch(CSV_URL);
                const csvText = await response.text();
                
                // Parse CSV rows while respecting quotes
                const rows = csvText.split('\n').map(row => row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/));

                allBooks = rows.slice(1).map((col, index) => {
                    const title = (col[0] || "").replace(/"/g, "").trim();
                    const author = (col[1] || "").replace(/"/g, "").trim();
                    const rank = (col[11] || "").replace(/"/g, "").trim() || "N/A";
                    const orderValue = parseInt(col[0]) || (index + 1); 
                    
                    // Logic to find the image: Check Col AM (38), then fallback to Col M (12)
                    let imgPath = (col[38] || col[12] || "").replace(/"/g, "").trim();
                    
                    let finalImg = "https://via.placeholder.com/300x450?text=No+Cover";
                    if (imgPath && imgPath.startsWith('http')) {
                        // Using a proxy to bypass Amazon hotlink protection
                        finalImg = `https://images.weserv.nl/?url=${encodeURIComponent(imgPath.replace(/^https?:\/\//, ''))}&w=400&fit=cover`;
                    }

                    return { title, author, rank, orderValue, image: finalImg };
                }).filter(b => b.title !== "" && b.title !== "Book");

                renderBooks();
            } catch (e) {
                console.error("Data Fetch Error:", e);
                document.getElementById('book-container').innerHTML = `<p class="col-span-full text-center text-red-500">Error: Could not load data from Google Sheets.</p>`;
            }
        }

        function changeSort(type) {
            currentSort = type;
            document.getElementById('sortOrder').className = type === 'order' ? 'bg-slate-900 text-white px-6 py-3 rounded-xl font-semibold shadow-md' : 'bg-white border border-slate-300 px-6 py-3 rounded-xl font-semibold';
            document.getElementById('sortTitle').className = type === 'title' ? 'bg-slate-900 text-white px-6 py-3 rounded-xl font-semibold shadow-md' : 'bg-white border border-slate-300 px-6 py-3 rounded-xl font-semibold';
            renderBooks();
        }

        function renderBooks() {
            const container = document.getElementById('book-container');
            const query = document.getElementById('searchInput').value.toLowerCase();
            
            let filtered = allBooks.filter(b => 
                b.title.toLowerCase().includes(query) || b.author.toLowerCase().includes(query)
            );

            if (currentSort === 'order') {
                filtered.sort((a, b) => a.orderValue - b.orderValue);
            } else {
                filtered.sort((a, b) => a.title.localeCompare(b.title));
            }

            container.innerHTML = filtered.map(book => `
                <div class="book-card bg-white rounded-2xl border border-slate-200 overflow-hidden flex flex-col shadow-sm">
                    <div class="aspect-[2/3] overflow-hidden bg-slate-100">
                        <img src="${book.image}" alt="${book.title}" class="w-full h-full object-cover" onerror="this.src='https://via.placeholder.com/300x450?text=Image+Not+Found'">
                    </div>
                    <div class="p-4 flex-grow flex flex-col">
                        <div class="flex-grow">
                            <h3 class="font-bold text-sm leading-tight text-slate-800 line-clamp-2" title="${book.title}">${book.title}</h3>
                            <p class="text-xs font-semibold text-blue-600 mt-1 uppercase tracking-tight">${book.author}</p>
                        </div>
                        <div class="mt-4 pt-3 border-t border-slate-50 flex flex-col gap-1">
                            <div class="flex justify-between items-center">
                                <span class="text-[9px] uppercase font-bold text-slate-400 tracking-widest">Order</span>
                                <span class="text-[10px] font-bold text-slate-700">${book.orderValue}</span>
                            </div>
                            <div class="flex justify-between items-center">
                                <span class="text-[9px] uppercase font-bold text-slate-400 tracking-widest">Rank</span>
                                <span class="text-xs font-black text-slate-900">#${book.rank}</span>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        document.getElementById('searchInput').addEventListener('input', renderBooks);
        loadData();
    </script>
</body>
</html>
