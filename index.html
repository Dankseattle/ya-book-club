<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ya Book Club Rankings</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .book-card { transition: transform 0.2s; }
        .book-card:hover { transform: scale(1.02); }
    </style>
</head>
<body class="bg-gray-100 font-sans">

    <header class="bg-slate-900 text-white py-10 px-4 text-center">
        <h1 class="text-4xl font-bold">Ya Book Club</h1>
        <p class="mt-2 text-slate-300">Official Rankings & Library</p>
    </header>

    <main class="max-w-6xl mx-auto p-6">
        <div id="book-container" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <p class="text-center col-span-full">Loading library...</p>
        </div>
    </main>

    <script>
        // Your specific Google Sheet CSV Export Link
        const sheetUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vS_H-8_2O4hE0V7J4V_n9vjP9v9v9v9v9v9v9v9v9v/pub?output=csv'; 
        // NOTE: Use the link you got from "Publish to Web" as a CSV.

        async function fetchBooks() {
            try {
                const response = await fetch('https://docs.google.com/spreadsheets/d/13bOmsDf8HibgVqyfcKWoH7SZPxk3k3ZIIOf--mduqbU/gviz/tq?tqx=out:json');
                const text = await response.text();
                // Clean up the Google JSON response
                const json = JSON.parse(text.substr(47).slice(0, -2));
                const rows = json.table.rows;
                const container = document.getElementById('book-container');
                container.innerHTML = '';

                rows.forEach(row => {
                    const book = row.c[0]?.v || "Unknown Title";
                    const author = row.c[1]?.v || "Unknown Author";
                    const imgUrl = row.c[12]?.v || "https://via.placeholder.com/150x200?text=No+Cover";
                    const consensus = row.c[11]?.v || "N/A";

                    const card = `
                        <div class="book-card bg-white rounded-lg shadow-md overflow-hidden border border-gray-200">
                            <img src="${imgUrl}" alt="${book}" class="w-full h-64 object-cover">
                            <div class="p-4">
                                <h3 class="font-bold text-lg leading-tight h-12 overflow-hidden">${book}</h3>
                                <p class="text-gray-600 text-sm mb-2">${author}</p>
                                <div class="mt-3 pt-3 border-t border-gray-100 flex justify-between items-center">
                                    <span class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Consensus</span>
                                    <span class="bg-blue-100 text-blue-800 text-xs font-bold px-2.5 py-0.5 rounded">${consensus}</span>
                                </div>
                            </div>
                        </div>
                    `;
                    container.innerHTML += card;
                });
            } catch (error) {
                console.error("Error fetching data:", error);
                document.getElementById('book-container').innerHTML = "Failed to load books. Make sure the Google Sheet is shared correctly.";
            }
        }

        fetchBooks();
    </script>
</body>
</html>
