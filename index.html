<script>
    // ... inside the load() function's mapping logic ...
    allData = rows.slice(1).map((col, index) => {
        const order = parseInt(col[0]) || (index + 1);
        return {
            order: order,
            title: (col[1] || "").replace(/"/g, "").trim(),
            author: (col[2] || "").replace(/"/g, "").trim(),
            kirk: parseInt(col[3]) || 999,      
            huber: parseInt(col[4]) || 999,     
            lattanzio: parseInt(col[5]) || 999, 
            walco: parseInt(col[6]) || 999,     
            driscoll: parseInt(col[7]) || 999,  
            rank: parseInt(col[11]) || 999,     
            genre: (col[17] || "").replace(/"/g, "").trim() || "Other",
            // NEW: Column AN (index 39) and Column AO (index 40)
            pages: (col[39] || "").replace(/"/g, "").trim() || "N/A",
            length: (col[40] || "").replace(/"/g, "").trim() || "N/A",
            image: `covers/${order}.jpg`
        };
    }).filter(b => b.title !== "" && b.title !== "Book");

    // ... inside the openModal() function ...
    function openModal(index) {
        const b = allData.find(x => x.order === index);
        if(!b) return;
        // ... (existing modal updates) ...
        document.getElementById('modal-pages').innerText = b.pages + " pgs";
        document.getElementById('modal-length').innerText = b.length;
        document.getElementById('modal').classList.add('active');
    }
</script>

<div id="modal" onclick="closeModal()">
    <div class="bg-white w-full max-w-lg rounded-[2.5rem] overflow-hidden shadow-2xl relative" onclick="event.stopPropagation()">
        <div class="flex gap-4 mb-6">
            <div class="bg-slate-50 p-3 rounded-xl flex-1 text-center border border-slate-100">
                <p class="text-[8px] font-black text-slate-400 uppercase mb-1">Book Length</p>
                <p id="modal-pages" class="text-sm font-bold text-slate-700"></p>
            </div>
            <div class="bg-slate-50 p-3 rounded-xl flex-1 text-center border border-slate-100">
                <p class="text-[8px] font-black text-slate-400 uppercase mb-1">Audio Length</p>
                <p id="modal-length" class="text-sm font-bold text-slate-700"></p>
            </div>
        </div>
        </div>
</div>
