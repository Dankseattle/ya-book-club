<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ya Dood Book Club</title>
    <link rel="icon" type="image/png" href="clublogo.png">
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;900&family=Space+Grotesk:wght@300;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="stylesheet" href="styles.css">

    <meta property="og:title" content="Ya Dood Book Club">
    <meta property="og:image" content="https://yadoodbook.club/share.jpg">
    <meta name="twitter:card" content="summary_large_image">
</head>
<body>

    <div class="stats-bar py-2 px-4">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex gap-6">
                <span>Books <span id="stat-count" class="stat-val">-</span></span>
                <span>Pages <span id="stat-pages" class="stat-val">-</span></span>
                <span>Time <span id="stat-mins" class="stat-val">-</span></span>
            </div>
            <div class="hidden sm:block"><span class="w-1.5 h-1.5 bg-green-500 rounded-full inline-block mr-2"></span>Database Live</div>
        </div>
    </div>

    <header class="sticky-header pt-6 pb-4 px-4">
        <div class="max-w-7xl mx-auto flex flex-col items-center">
            <img src="clublogo.png" class="h-12 w-auto mb-6" onerror="this.style.display='none'">
            
            <div class="nav-container mb-6">
                <div id="nav-lib" class="nav-item active" onclick="switchTab('library')">The Library</div>
                <div id="nav-com" class="nav-item" onclick="switchTab('committee')">The Committee</div>
                <div id="nav-line" class="nav-indicator"></div>
            </div>

            <div id="library-controls" class="w-full max-w-4xl transition-all duration-300">
                <div class="flex flex-col md:flex-row gap-3 justify-center items-center">
                    <input type="text" id="searchInput" placeholder="Search..." class="px-4 py-2 border rounded-full w-full md:w-64 text-sm outline-none focus:ring-2 focus:ring-blue-500 bg-white shadow-sm font-sans">
                    <div class="flex gap-2 flex-wrap justify-center">
                        <button onclick="setSort('rank')" id="btn-rank" class="btn-active px-4 py-2 rounded-full border text-[10px] font-bold uppercase transition bg-white text-slate-500">Rank</button>
                        <button onclick="setSort('order')" id="btn-order" class="px-4 py-2 rounded-full border text-[10px] font-bold uppercase transition bg-white text-slate-500">Order</button>
                        <button onclick="setSort('title')" id="btn-title" class="px-4 py-2 rounded-full border text-[10px] font-bold uppercase transition bg-white text-slate-500">A-Z</button>
                        <select id="memberSelect" onchange="setSort(this.value)" class="px-4 py-2 rounded-full border text-[10px] font-bold uppercase bg-white text-slate-500 outline-none cursor-pointer hover:bg-slate-50">
                            <option value="" disabled selected>By Member</option>
                            <option value="kirk">Kirk</option>
                            <option value="huber">Huber</option>
                            <option value="lattanzio">Lattanzio</option>
                            <option value="walco">Walco</option>
                        </select>
                    </div>
                </div>
                <div class="flex gap-2 justify-center mt-3">
                    <button onclick="setGenre('All')" id="gen-All" class="btn-active px-3 py-1 rounded-full border text-[9px] font-bold uppercase transition">All</button>
                    <button onclick="setGenre('Fiction')" id="gen-Fiction" class="px-3 py-1 rounded-full border text-[9px] font-bold uppercase transition bg-white text-slate-400">Fiction</button>
                    <button onclick="setGenre('Non-Fiction')" id="gen-Non-Fiction" class="px-3 py-1 rounded-full border text-[9px] font-bold uppercase transition bg-white text-slate-400">Non-Fiction</button>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-6 min-h-screen">
        <div id="section-library">
            <div class="hero-scroller mb-10">
                <div class="hero-wrapper" id="hero-last"></div>
                <div class="hero-wrapper" id="hero-reading"></div>
                <div class="hero-wrapper" id="hero-next"></div>
            </div>

            <div class="flex justify-between items-end border-b pb-4 mb-8">
                <h2 class="text-xs font-black uppercase tracking-widest text-slate-400">Full Collection</h2>
                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest"><span id="count-display" class="text-slate-900">0</span> Books</p>
            </div>
            
            <div id="grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-5"></div>
            <div id="empty-state" class="hidden text-center py-20 text-slate-400 font-bold uppercase text-xs tracking-widest">No books found</div>
        </div>

        <div id="section-committee" class="hidden-section">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-12">
                <div id="insight-1"></div>
                <div id="insight-2"></div>
                <div id="insight-3"></div>
            </div>
            <h2 class="text-xs font-black uppercase tracking-widest text-slate-400 mb-6 border-b pb-4">Member Profiles</h2>
            <div id="member-grid" class="grid grid-cols-1 md:grid-cols-2 gap-8"></div>
        </div>
    </main>

    <div id="modal" onclick="closeModal()">
        <div id="modal-content" class="bg-white w-full max-w-lg rounded-[2rem] overflow-hidden shadow-2xl relative p-8 text-center" onclick="event.stopPropagation()">
            <img id="m-img" class="w-32 h-32 mx-auto rounded-lg shadow-md mb-4 object-cover">
            <h2 id="m-title" class="text-xl font-black uppercase leading-tight mb-1 font-header"></h2>
            <p id="m-author" class="text-xs font-bold text-slate-400 uppercase mb-4"></p>
            <div class="flex justify-center gap-4 mb-6">
                <div class="text-center"><p class="text-[8px] font-bold text-slate-400 uppercase">Rank</p><p id="m-rank" class="text-lg font-black text-blue-600">#1</p></div>
                <div class="text-center"><p class="text-[8px] font-bold text-slate-400 uppercase">Pages</p><p id="m-pages" class="text-lg font-black text-slate-800">320</p></div>
            </div>
            <div id="m-scores" class="grid grid-cols-4 gap-2"></div>
        </div>
    </div>

   <script src="script.js?v=2"></script>
</body>
</html>
