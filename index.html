<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ya Book Club Library</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .book-card { transition: all 0.3s ease; }
        .book-card:hover { transform: translateY(-5px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">

    <header class="bg-white border-b border-slate-200 py-10 px-4 mb-8 shadow-sm text-center">
        <h1 class="text-5xl font-extrabold tracking-tight text-slate-900 mb-2">Ya Book Club</h1>
        <p class="text-slate-500 text-lg">Official Rankings & Library</p>
        
        <div class="mt-8 flex flex-col md:flex-row gap-4 justify-center items-center max-w-4xl mx-auto">
            <input type="text" id="searchInput" placeholder="Search title or author..." 
                class="px-5 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none w-full md:w-80 shadow-sm">
            
            <div class="flex gap-2">
                <button onclick="changeSort('order')" id="sortOrder" class="bg-slate-900 text-white px-6 py-3 rounded-xl font-semibold shadow-md transition">Reading Order</button>
                <button onclick="changeSort('title')" id="sortTitle" class="bg-white border border-slate-300 px-6 py-3 rounded-xl font-semibold transition">A-Z Title</button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-4">
        <div id="book-container" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-6">
            <div class="col-span-full text-center py-20 text-slate-400 text-xl font-medium">Loading books...</div>
        </div>
    </main>

    <script>
        let allBooks = [];
        let currentSort = 'order';
        const SHEET_ID = '13bOmsDf8HibgVqyfcKWoH7SZPxk3k3ZIIOf--mduqbU';
        const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=0`;

        async function loadData() {
            try {
                const response = await fetch(CSV_URL);
                const csvText = await response.text();
                const rows = csvText.split('\n').map(row => row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/));

                allBooks = rows.slice(1).map((col, index) => {
                    const title = (col[0] || "").replace(/"/g, "").trim();
                    const author = (col[1] || "").replace(/"/g, "").trim();
                    // Column L (index 11) = Consensus/Rank
                    const rank = col[11] ? col[11].replace(/"/g, "").trim() : "N/A";
                    // Reading Order is from the very first column (index 0)
                    const readingOrder = parseInt(col[0]) || (index + 1); 
                    
                    // Column AM (index 38) for Images
                    let rawImg = (col[38] || "").replace(/"/g, "").trim();
                    
                    // Proxy the image to bypass Amazon blocks
                    let imgUrl = "https://via.placeholder.com/300x450?text=No+Cover";
                    if (rawImg && rawImg.includes('http')) {
                        const cleanUrl = rawImg.split('://')[1];
                        imgUrl = `https://images.weserv.nl/?url=${encodeURIComponent(cleanUrl)}&w=400&fit=cover`;
                    }

                    return { title, author, rank, readingOrder, image: imgUrl };
                }).filter(b => b.title !== "" && b.title !== "Book");

                renderBooks();
            } catch (e) {
                console.error(e);
                document.getElementById('book-container').innerHTML = `<p class="col-span-full text-center text-red-500">Connection Error. Is the sheet public?</p>`;
            }
        }

        function changeSort(type) {
            currentSort = type;
            document.getElementById('sortOrder').className = type === 'order' ? 'bg-slate-900 text-white px-6 py-3 rounded-xl font-semibold shadow-md' : 'bg-white border border-slate-300 px-6 py-3 rounded-xl font-semibold';
            document.getElementById('sortTitle').className = type === 'title' ? 'bg-slate-900 text-white px-6 py-3 rounded-xl font-semibold shadow-md' : 'bg-white border border-slate-300 px-6 py-3 rounded-xl font-semibold';
            renderBooks();
        }

        function renderBooks() {
            const container = document.getElementById('book-container');
            const query = document.getElementById('searchInput').value.toLowerCase();
            
            let filtered = allBooks.filter(b => 
                b.title.toLowerCase().includes(query) || b.author.toLowerCase().includes(query)
            );

            if (currentSort === 'order') {
                filtered.sort((a, b) => a.readingOrder - b.readingOrder);
            } else {
                filtered.sort((a, b) => a.title.localeCompare(b.title));
            }

            container.innerHTML = filtered.map(book => `
                <div class="book-card bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden flex flex-col h-full">
                    <div class="aspect-[2/3] overflow-hidden bg-slate-100 relative">
                        <img src="${book.image}" alt="${book.title}" class="w-full h-full object-cover" onerror="this.src='https://via.placeholder.com/300x450?text=Image+Error'">
                        <div class="absolute top-2 left-2 bg-black/70 text-white text-[10px] font-bold px-2 py-1 rounded backdrop-blur-sm shadow-md">
                            READING ORDER: ${book.readingOrder}
                        </div>
                    </div>
                    <div class="p-4 flex-grow flex flex-col justify-between">
                        <div>
                            <h3 class="font-bold text-sm leading-tight text-slate-800 line-clamp-2">${book.title}</h3>
                            <p class="text-xs font-medium text-blue-600 mt-1 uppercase tracking-wider">${book.author}</p>
                        </div>
                        <div class="mt-4 pt-3 border-t border-slate-100 flex justify-between items-center">
                            <span class="text-[10px] uppercase font-bold text-slate-400">Consensus Rank</span>
                            <span class="text-sm font-black text-slate-900">#${book.rank}</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        document.getElementById('searchInput').addEventListener('input', renderBooks);
        loadData();
    </script>
</body>
</html>
