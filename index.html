<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ya Book Club</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .book-card { transition: all 0.3s ease; border-radius: 1.5rem; display: flex; flex-direction: column; height: 100%; overflow: hidden; border: 1px solid #e2e8f0; background: white; }
        .book-card:hover { transform: translateY(-5px); box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1); }
        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .btn-active { background-color: #0f172a !important; color: white !important; border-color: #0f172a !important; }
    </style>
</head>
<body>

    <header class="bg-white border-b py-10 px-4 text-center">
        <h1 class="text-5xl font-black italic uppercase tracking-tighter mb-4">YA BOOK CLUB</h1>
        <div class="max-w-5xl mx-auto space-y-6">
            <div class="flex flex-col md:flex-row gap-3 justify-center">
                <input type="text" id="searchInput" placeholder="Search books..." class="px-5 py-3 border rounded-xl w-full md:w-80 shadow-sm outline-none">
                <div class="flex gap-2 justify-center">
                    <button onclick="setSort('order')" id="sort-order" class="btn-active px-5 py-3 rounded-xl font-bold border shadow-sm transition">ORDER</button>
                    <button onclick="setSort('rank')" id="sort-rank" class="bg-white px-5 py-3 rounded-xl font-bold border shadow-sm transition text-slate-500">RANK</button>
                    <button onclick="setSort('title')" id="sort-title" class="bg-white px-5 py-3 rounded-xl font-bold border shadow-sm transition text-slate-500">A-Z</button>
                </div>
            </div>
            <div class="flex gap-2 justify-center">
                <button onclick="setGenre('All')" id="gen-All" class="btn-active px-4 py-1.5 rounded-full text-xs font-bold border transition">ALL</button>
                <button onclick="setGenre('Fiction')" id="gen-Fiction" class="bg-white px-4 py-1.5 rounded-full text-xs font-bold border transition text-slate-500">FICTION</button>
                <button onclick="setGenre('Non-Fiction')" id="gen-Non-Fiction" class="bg-white px-4 py-1.5 rounded-full text-xs font-bold border transition text-slate-500">NON-FICTION</button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-6">
        <div id="grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-6">
            <div class="col-span-full text-center py-20 text-slate-400 font-bold uppercase tracking-widest">Streaming from Sheets...</div>
        </div>
    </main>

    <script>
        let allData = [];
        let sortMode = 'order';
        let filterGenre = 'All';

        const SPREADSHEET_ID = '13bOmsDf8HibgVqyfcKWoH7SZPxk3k3ZIIOf--mduqbU';
        const DATA_URL = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/export?format=csv&gid=0`;

        async function load() {
            try {
                const res = await fetch(DATA_URL);
                const csvText = await res.text();
                const rows = csvText.split('\n').map(row => row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/));

                allData = rows.slice(1).map((col, index) => {
                    const title = (col[1] || "").replace(/"/g, "").trim();
                    const author = (col[2] || "").replace(/"/g, "").trim();
                    const rank = (col[11] || "").replace(/"/g, "").trim() || "N/A";
                    const order = parseInt(col[0]) || (index + 1);
                    const genre = (col[17] || "").replace(/"/g, "").trim() || "Other";
                    
                    // Column AM is index 38. Fallback to index 12 if empty.
                    let imgUrl = (col[38] || col[12] || "").replace(/"/g, "").trim();

                    let finalImg = "https://via.placeholder.com/400x600?text=No+Cover";
                    if (imgUrl && imgUrl.startsWith('http')) {
                        // NEW PROXY STRATEGY: Using wsrv.nl to bypass Amazon blocks
                        finalImg = `https://wsrv.nl/?url=${encodeURIComponent(imgUrl.replace(/^https?:\/\//, ''))}&w=400&output=jpg`;
                    }
                    
                    return { title, author, rank, order, genre, image: finalImg };
                }).filter(b => b.title !== "" && b.title !== "Book");

                render();
            } catch (e) {
                console.error(e);
                document.getElementById('grid').innerHTML = "<div class='col-span-full text-center'>Error loading data. Check Publish settings.</div>";
            }
        }

        function setSort(s) { sortMode = s; render(); }
        function setGenre(g) { filterGenre = g; render(); }

        function render() {
            const container = document.getElementById('grid');
            const search = document.getElementById('searchInput').value.toLowerCase();

            ['order', 'rank', 'title'].forEach(id => document.getElementById('sort-'+id).className = sortMode === id ? "btn-active px-5 py-3 rounded-xl font-bold border shadow-sm transition" : "bg-white px-5 py-3 rounded-xl font-bold border shadow-sm text-slate-500 transition");
            ['All', 'Fiction', 'Non-Fiction'].forEach(id => {
                const btn = document.getElementById('gen-'+id);
                if(btn) btn.className = filterGenre === id ? "btn-active px-4 py-1.5 rounded-full text-xs font-bold border transition shadow-sm" : "bg-white px-4 py-1.5 rounded-full text-xs font-bold border transition text-slate-500 shadow-sm";
            });

            let items = allData.filter(b => (filterGenre === 'All' || b.genre === filterGenre) && (b.title.toLowerCase().includes(search) || b.author.toLowerCase().includes(search)));

            if (sortMode === 'order') items.sort((a,b) => a.order - b.order);
            else if (sortMode === 'rank') items.sort((a,b) => (parseInt(a.rank) || 999) - (parseInt(b.rank) || 999));
            else items.sort((a,b) => a.title.localeCompare(b.title));

            container.innerHTML = items.map(b => `
                <div class="book-card shadow-sm">
                    <div class="aspect-[2/3] bg-slate-200">
                        <img src="${b.image}" alt="${b.title}" class="w-full h-full object-cover" 
                             onerror="this.onerror=null;this.src='https://via.placeholder.com/400x600?text=Cover+Locked';">
                    </div>
                    <div class="p-4 flex flex-col flex-grow">
                        <div class="flex-grow mb-4">
                            <h3 class="font-black text-sm uppercase leading-tight line-clamp-2 text-slate-900">${b.title}</h3>
                            <p class="text-[10px] font-bold text-blue-600 mt-1 uppercase tracking-wider">${b.author}</p>
                            <span class="inline-block mt-2 px-2 py-0.5 bg-slate-100 text-slate-500 text-[9px] font-bold rounded uppercase">${b.genre}</span>
                        </div>
                        <div class="pt-3 border-t flex justify-between items-end">
                            <div class="text-left">
                                <p class="text-[8px] font-black text-slate-400 uppercase">Order</p>
                                <p class="text-xs font-bold text-slate-700">${b.order}</p>
                            </div>
                            <div class="text-right">
                                <p class="text-[8px] font-black text-slate-400 uppercase">Rank</p>
                                <p class="text-xs font-black italic text-slate-900">#${b.rank}</p>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        document.getElementById('searchInput').addEventListener('input', render);
        load();
    </script>
</body>
</html>
