<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Committee Profiles - Ya Dood Book Club</title>
    <link rel="icon" type="image/png" href="clublogo.png">
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #0f172a; -webkit-font-smoothing: antialiased; }
        h1, h2, h3, .font-header { font-family: 'Space Grotesk', sans-serif; }
        
        .member-card { background: white; border: 1px solid #e2e8f0; border-radius: 1.5rem; overflow: hidden; transition: all 0.3s ease; }
        .member-card.expanded { box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04); border-color: #cbd5e1; }
        
        .avatar-circle { width: 3.5rem; height: 3.5rem; border-radius: 9999px; object-fit: cover; border: 2px solid white; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        .avatar-placeholder { width: 3.5rem; height: 3.5rem; border-radius: 9999px; background: #e2e8f0; display: flex; align-items: center; justify-content: center; font-weight: 800; color: #64748b; font-size: 1.25rem; border: 2px solid white; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }

        /* Animation */
        .details-panel { max-height: 0; overflow: hidden; transition: max-height 0.5s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.4s ease; opacity: 0; }
        .member-card.expanded .details-panel { max-height: 2000px; opacity: 1; }
        
        .chevron { transition: transform 0.3s ease; }
        .member-card.expanded .chevron { transform: rotate(180deg); }

        .tag-base { font-weight: 800; font-size: 0.65rem; padding: 3px 8px; border-radius: 99px; text-transform: uppercase; display: inline-block; }
        .tag-blue { background: #eff6ff; color: #1e40af; border: 1px solid #dbeafe; }
        .tag-green { background: #f0fdf4; color: #166534; border: 1px solid #dcfce7; }
        .tag-red { background: #fef2f2; color: #991b1b; border: 1px solid #fee2e2; }
    </style>
</head>
<body>

    <header class="bg-white/80 backdrop-blur-md border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-3xl mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <img src="clublogo.png" class="h-8 w-auto" onerror="this.style.display='none'">
                <h1 class="text-lg font-black uppercase tracking-tight font-header">The Committee</h1>
            </div>
            <a href="index.html" class="text-[10px] font-bold uppercase text-slate-400 hover:text-slate-900 transition bg-slate-100 px-3 py-1.5 rounded-full">Back to Library</a>
        </div>
    </header>

    <main class="max-w-3xl mx-auto px-6 py-8">
        <div id="loading" class="text-center py-20">
            <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-slate-900 mx-auto mb-4"></div>
            <p class="text-xs font-bold uppercase text-slate-400 tracking-widest">Loading Roster...</p>
        </div>
        
        <div id="content" class="hidden space-y-6">
            </div>
    </main>

    <div id="modal" class="fixed inset-0 bg-slate-900/80 hidden z-[100] items-center justify-center backdrop-blur-sm p-6" onclick="closeModal()">
        <div class="bg-white rounded-3xl max-w-sm w-full shadow-2xl overflow-hidden transform transition-all scale-100 relative" onclick="event.stopPropagation()">
            <button onclick="closeModal()" class="absolute top-4 right-4 bg-slate-100 hover:bg-slate-200 text-slate-500 rounded-full w-8 h-8 flex items-center justify-center font-bold">&times;</button>
            
            <div class="p-8 text-center pb-4">
                <img id="m-img" class="w-32 h-32 mx-auto rounded-lg shadow-lg mb-6 object-cover bg-slate-100">
                <h2 id="m-title" class="text-xl font-black uppercase font-header leading-tight mb-1 text-slate-900"></h2>
                <p id="m-author" class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-4"></p>
                
                <div class="inline-block bg-slate-900 text-white px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider mb-6">
                    Ranked <span id="m-rank"></span>
                </div>

                <div class="grid grid-cols-4 gap-2 text-center" id="m-scores">
                    </div>
            </div>
            <div class="bg-slate-50 p-4 text-center border-t border-slate-100">
                <p class="text-[9px] font-bold text-slate-400 uppercase">Click outside to close</p>
            </div>
        </div>
    </div>

    <script>
        const SHEET_ID = '13bOmsDf8HibgVqyfcKWoH7SZPxk3k3ZIIOf--mduqbU';
        const members = [{id:'kirk', n:'Kirk'},{id:'huber', n:'Huber'},{id:'lattanzio', n:'Lattanzio'},{id:'walco', n:'Walco'}];
        let allData = [];

        async function load() {
            try {
                const res = await fetch(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=0`);
                const txt = await res.text();
                
                allData = txt.split('\n').slice(1).map((r, i) => {
                    const c = r.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                    const rRaw = (c[11]||"").replace(/"/g,"").trim();
                    const hasRank = rRaw && rRaw !== 'N/A';
                    
                    return {
                        id: parseInt(c[0])||(i+1),
                        title: (c[1]||"").replace(/"/g,""),
                        author: (c[2]||"").replace(/"/g,""),
                        rank: hasRank ? parseInt(rRaw) : 999,
                        genre: (c[17]||"Other").replace(/"/g,"").trim(),
                        selector: (c[16]||"").replace(/"/g,""),
                        img: `covers/${parseInt(c[0])||(i+1)}.jpg`,
                        scores: [parseInt(c[3])||999, parseInt(c[4])||999, parseInt(c[5])||999, parseInt(c[6])||999]
                    };
                }).filter(b => b.title && b.title !== "Book");

                renderCards();
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('content').classList.remove('hidden');

            } catch (e) { console.error(e); document.getElementById('loading').innerHTML = "Error loading data."; }
        }

        function toggleCard(id) {
            const card = document.getElementById(`card-${id}`);
            const wasExpanded = card.classList.contains('expanded');
            document.querySelectorAll('.member-card').forEach(c => c.classList.remove('expanded'));
            if (!wasExpanded) card.classList.add('expanded');
        }

        function renderCards() {
            const container = document.getElementById('content');
            const ranked = allData.filter(b => b.rank !== 999);

            container.innerHTML = members.map((m, mIdx) => {
                // --- CALCS ---
                
                // 1. Portfolio (My Selections)
                const myPicks = ranked.filter(b => b.selector.toLowerCase().includes(m.n.toLowerCase()));
                myPicks.sort((a,b) => a.rank - b.rank); // Best to worst
                const avgPickRank = myPicks.length ? Math.round(myPicks.reduce((a,b)=>a+b.rank,0)/myPicks.length) : '-';

                // 2. Alignment (Formerly Contrarian Score)
                let totalDev = 0, devCount = 0;
                ranked.forEach(b => {
                    if(b.scores[mIdx] !== 999) { totalDev += Math.abs(b.scores[mIdx] - b.rank); devCount++; }
                });
                // Calculate percentage (0 diff = 100%, 50 diff = 0%)
                const avgDiff = devCount ? (totalDev / devCount) : 50;
                const alignment = Math.max(0, Math.round(100 - (avgDiff * 1.5))); // Scale factor to make it look like a score

                // 3. Hot Takes
                let biggestLove = { diff: -999, book: null };
                let biggestHate = { diff: 999, book: null };
                ranked.forEach(b => {
                    const myScore = b.scores[mIdx];
                    if (myScore !== 999) {
                        const diff = b.rank - myScore; 
                        if (diff > biggestLove.diff) biggestLove = { diff, book: b };
                        if (diff < biggestHate.diff) biggestHate = { diff, book: b };
                    }
                });

                // 4. Lists
                const faves = allData.filter(b => b.scores[mIdx] !== 999).sort((a,b) => a.scores[mIdx] - b.scores[mIdx]).slice(0, 5);
                const least = allData.filter(b => b.scores[mIdx] !== 999).sort((a,b) => b.scores[mIdx] - a.scores[mIdx]).slice(0, 5);

                // --- HTML ---
                return `
                <div id="card-${m.id}" class="member-card cursor-pointer group" onclick="toggleCard('${m.id}')">
                    
                    <div class="p-5 flex flex-col sm:flex-row gap-5">
                        
                        <div class="flex flex-row sm:flex-col items-center sm:items-start gap-4 sm:w-1/3 sm:border-r border-slate-100 sm:pr-4">
                            <div class="flex-shrink-0">
                                <img src="members/${m.id}.jpg" class="avatar-circle hidden" onload="this.classList.remove('hidden')" onerror="this.style.display='none'">
                                <div class="avatar-placeholder" id="ph-${m.id}">${m.n.substring(0,1)}</div>
                                <script>document.querySelector('img[src="members/${m.id}.jpg"]').onerror = function(){ document.getElementById('ph-${m.id}').style.display='flex'; }<\/script>
                            </div>
                            <div>
                                <h2 class="text-2xl font-black uppercase italic font-header leading-none mb-2 text-slate-900">${m.n}</h2>
                                <div class="flex gap-2">
                                    <div class="bg-slate-50 border border-slate-200 px-2 py-1 rounded text-center">
                                        <div class="text-[8px] font-bold uppercase text-slate-400">Alignment</div>
                                        <div class="text-sm font-black text-blue-600">${alignment}%</div>
                                    </div>
                                    <div class="bg-slate-50 border border-slate-200 px-2 py-1 rounded text-center">
                                        <div class="text-[8px] font-bold uppercase text-slate-400">Avg Pick</div>
                                        <div class="text-sm font-black text-slate-900">#${avgPickRank}</div>
                                    </div>
                                </div>
                                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest flex items-center gap-1 mt-3 group-hover:text-blue-500 transition">
                                    Full Stats 
                                    <svg class="chevron w-3 h-3 text-slate-300 group-hover:text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                                </p>
                            </div>
                        </div>

                        <div class="flex-grow min-w-0">
                            <p class="text-[9px] font-bold text-green-600 uppercase tracking-widest mb-2 flex items-center gap-1">
                                <span class="w-1.5 h-1.5 bg-green-500 rounded-full"></span> Hall of Fame
                            </p>
                            <div class="space-y-1.5">
                                ${faves.map((b, i) => `
                                    <div class="flex items-center gap-2 hover:bg-slate-50 p-1 rounded transition" onclick="openModal(${b.id}); event.stopPropagation();">
                                        <span class="text-[10px] font-bold text-green-600 bg-green-50 w-4 h-4 flex items-center justify-center rounded-full border border-green-100 flex-shrink-0">${i+1}</span>
                                        <div class="min-w-0 flex-grow flex items-baseline justify-between gap-2">
                                            <p class="text-xs font-bold text-slate-900 truncate">${b.title}</p>
                                            <span class="text-[9px] font-medium text-slate-400 whitespace-nowrap">#${b.rank}</span>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>

                    <div class="details-panel bg-slate-50 border-t border-slate-100">
                        <div class="p-6 grid grid-cols-1 md:grid-cols-2 gap-8">
                            
                            <div class="space-y-6">
                                <div>
                                    <h3 class="text-[10px] font-black uppercase text-slate-400 tracking-widest mb-3">Portfolio (My Selections)</h3>
                                    <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
                                        ${myPicks.length === 0 ? '<p class="p-4 text-xs text-slate-400">No selections yet.</p>' : 
                                          myPicks.map((b, i) => `
                                            <div class="flex items-center justify-between p-2.5 border-b border-slate-100 last:border-0 hover:bg-slate-50 cursor-pointer" onclick="openModal(${b.id}); event.stopPropagation();">
                                                <div class="flex items-center gap-2 min-w-0">
                                                    <span class="text-[9px] font-bold text-slate-400 w-4">#${b.rank}</span>
                                                    <p class="text-xs font-bold text-slate-900 truncate">${b.title}</p>
                                                </div>
                                                ${i===0 ? '<span class="tag-base tag-green">Best</span>' : ''}
                                                ${i===myPicks.length-1 && myPicks.length > 1 ? '<span class="tag-base tag-red">Worst</span>' : ''}
                                            </div>
                                        `).join('')}
                                    </div>
                                </div>
                            </div>

                            <div class="space-y-6">
                                
                                <div>
                                    <h3 class="text-[10px] font-black uppercase text-red-600 tracking-widest mb-3 flex items-center gap-1">
                                        <span class="w-1.5 h-1.5 bg-red-500 rounded-full"></span> Hall of Shame
                                    </h3>
                                    <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden p-3 space-y-1.5">
                                        ${least.map((b, i) => `
                                            <div class="flex items-center gap-2 hover:bg-slate-50 p-1 rounded transition cursor-pointer" onclick="openModal(${b.id}); event.stopPropagation();">
                                                <span class="text-[10px] font-bold text-red-500 w-4 text-center">${i+1}</span>
                                                <div class="min-w-0 flex-grow">
                                                    <p class="text-xs font-bold text-slate-900 truncate">${b.title}</p>
                                                </div>
                                                <span class="text-[9px] font-medium text-slate-400 whitespace-nowrap">#${b.scores[mIdx]}</span>
                                            </div>
                                        `).join('')}
                                    </div>
                                </div>

                                <div>
                                    <h3 class="text-[10px] font-black uppercase text-slate-400 tracking-widest mb-3">Hot Takes</h3>
                                    <div class="space-y-2">
                                        <div class="bg-white p-3 rounded-xl border border-slate-200 flex justify-between items-center cursor-pointer hover:border-blue-300 transition" onclick="openModal(${biggestLove.book?.id}); event.stopPropagation();">
                                            <div><span class="tag-base tag-blue mb-1">Underrated</span><div class="font-bold text-xs text-slate-900 line-clamp-1">${biggestLove.book?.title || '-'}</div></div>
                                            <div class="text-right">
                                                <div class="text-xs font-bold text-slate-900">#${biggestLove.book ? biggestLove.book.scores[mIdx] : '-'}</div>
                                                <div class="text-[8px] text-slate-400">vs #${biggestLove.book?.rank}</div>
                                            </div>
                                        </div>
                                        <div class="bg-white p-3 rounded-xl border border-slate-200 flex justify-between items-center cursor-pointer hover:border-red-300 transition" onclick="openModal(${biggestHate.book?.id}); event.stopPropagation();">
                                            <div><span class="tag-base tag-red mb-1">Overrated</span><div class="font-bold text-xs text-slate-900 line-clamp-1">${biggestHate.book?.title || '-'}</div></div>
                                            <div class="text-right">
                                                <div class="text-xs font-bold text-slate-900">#${biggestHate.book ? biggestHate.book.scores[mIdx] : '-'}</div>
                                                <div class="text-[8px] text-slate-400">vs #${biggestHate.book?.rank}</div>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                            </div>

                        </div>
                    </div>
                </div>
                `;
            }).join('');
        }

        function openModal(id) {
            if(!id) return;
            const b = allData.find(x => x.id === id);
            if(!b) return;

            document.getElementById('m-title').innerText = b.title;
            document.getElementById('m-author').innerText = b.author;
            document.getElementById('m-rank').innerText = '#' + b.rank;
            document.getElementById('m-img').src = b.img;
            
            // Render Score Grid
            document.getElementById('m-scores').innerHTML = members.map((m,i) => `
                <div class="bg-slate-50 p-2 rounded border border-slate-100">
                    <div class="text-[8px] font-bold uppercase text-slate-400 mb-1">${m.n.substring(0,3)}</div>
                    <div class="text-sm font-black text-slate-900">${b.scores[i]===999?'-':b.scores[i]}</div>
                </div>
            `).join('');

            document.getElementById('modal').classList.remove('hidden');
            document.getElementById('modal').classList.add('flex');
        }

        function closeModal() {
            document.getElementById('modal').classList.add('hidden');
            document.getElementById('modal').classList.remove('flex');
        }

        load();
    </script>
</body>
</html>
